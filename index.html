/* ===================== #region L3 诊断引擎 Engine ===================== */
APP.Engine = {
  /* ===== 阶段1：解析转写稿 -> 时间切片（支持一行多时间戳 + 活动标记） ===== */
  parse:function(text){
    var self=this;
    var lines=String(text||'').split(/\r?\n/);
    var segments=[], words=0, lastSec=0;
    lines.forEach(function(line){
      line=line.trim(); if(!line) return;
      var marks=[], m, re=/\[(\d{1,2}):(\d{2})\]/g;
      while((m=re.exec(line))!==null){
        marks.push({ idx:m.index, sec:parseInt(m[1],10)*60+parseInt(m[2],10), ts:m[1]+':'+m[2] });
      }
      if(!marks.length) return;
      for(var i=0;i<marks.length;i++){
        var mk=marks[i];
        var raw=line.slice(mk.idx, i+1<marks.length ? marks[i+1].idx : line.length);
        raw=raw.replace(/^\[\d{1,2}:\d{2}\]\s*/, '').trim();
        if(!raw) continue;
        var seg=self._parseSegment(raw, mk.sec, mk.ts);
        segments.push(seg);
        if(!seg.isPause){ words += seg.text.replace(/[，。！？、；：""''（）\s]/g,'').length; }
        lastSec=mk.sec;
      }
    });
    var durationSec = segments.length ? Math.max(lastSec, segments[segments.length-1].sec) : 0;
    return { segments:segments, wordCount:words, durationSec:durationSec, raw:String(text||'') };
  },

  /* 阶段1内部：解析单段（提取活动标记 + 停顿秒数，支持中文数字） */
  _parseSegment:function(raw, sec, ts){
    var activities=[], pauseSec=0, m;
    var parenRe=/（([^）]*)）/g;
    while((m=parenRe.exec(raw))!==null){
      m[1].split(/[，,、]/).forEach(function(item){
        item=item.trim(); if(!item) return;
        var pm=item.match(/停顿\s*([0-9零一二两三四五六七八九十]+)\s*秒/);
        if(pm){ pauseSec=Math.max(pauseSec, this._cnNum(pm[1])); return; }
        var pn=item.match(/^\s*([0-9零一二两三四五六七八九十]+)\s*秒\s*$/);
        if(pn){ pauseSec=Math.max(pauseSec, this._cnNum(pn[1])); return; }
        if(/^停顿$/.test(item)) return;
        var act=this._activityOf(item);
        if(act) activities.push(act);
      }, this);
    }
    var text=raw.replace(parenRe,'').replace(/\s+/g,' ').trim();
    var isPause = (text==='' && activities.length===0 && pauseSec>0) || /^停顿\s*[0-9零一二两三四五六七八九十]+\s*秒$/.test(raw.trim());
    return { sec:sec, ts:ts, text:text, isPause:isPause, pauseSec:pauseSec, activities:activities };
  },

  /* 阶段1内部：中文数字 -> 阿拉伯数字（支持"十"及个位） */
  _cnNum:function(s){
    s=String(s).trim();
    if(/^\d+$/.test(s)) return parseInt(s,10);
    var map={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
    if(Object.prototype.hasOwnProperty.call(map,s)) return map[s];
    return 0;
  },

  /* 阶段1内部：活动标记 -> 标准活动名（板书/提问/讨论/演示等，供诊断维度证据归集） */
  _activityOf:function(item){
    var s=item.replace(/\s+/g,'');
    var map={
      '切换PPT':'切换PPT','切换':'切换PPT','PPT':'切换PPT','ppt':'切换PPT',
      '板书':'板书',
      '播放视频':'播放视频','视频':'播放视频','播放':'播放视频','播放视频后提问':'播放视频',
      '小组讨论':'小组讨论','讨论':'小组讨论','讨论结束':'小组讨论',
      '演示':'演示','实验':'演示','演示音叉':'演示',
      '提问学生':'提问学生','提问':'提问学生','学生回答':'提问学生','抽问':'提问学生','模拟学生作答':'提问学生',
      '学生齐答':'学生齐答','齐答互动':'学生齐答',
      '学生发言':'学生发言','学生自由发言':'学生发言','学生自由说想法':'学生发言',
      '留出思考时间':'留出思考时间',
      '手部动作':'手部动作',
      '试讲结束':'试讲结束','结束':'试讲结束','课堂结束':'试讲结束'
    };
    if(Object.prototype.hasOwnProperty.call(map,s)) return map[s];
    if(/ppt/i.test(s)) return '切换PPT';
    if(s.indexOf('板书')>=0) return '板书';
    if(s.indexOf('视频')>=0) return '播放视频';
    if(s.indexOf('讨论')>=0) return '小组讨论';
    if(s.indexOf('演示')>=0) return '演示';
    if(s.indexOf('齐答')>=0) return '学生齐答';
    if(s.indexOf('发言')>=0 || s.indexOf('想法')>=0) return '学生发言';
    if(s.indexOf('思考')>=0) return '留出思考时间';
    if(s.indexOf('提问')>=0 || s.indexOf('抽问')>=0 || s.indexOf('作答')>=0 || s.indexOf('回答')>=0) return '提问学生';
    if(s.indexOf('结束')>=0) return '试讲结束';
    return null;
  },

  /* 提取行为特征 */
  features:function(parsed){
    var text=parsed.segments.map(function(s){return s.isPause?'':s.text;}).join('\n');
    var f={ fillers:[], waitIssues:[], questions:[], questionCount:0, activities:{} };
    var full=text;
    /* 填充词 */
    APP.KB.behaviorRules.fillerWords.forEach(function(w){
      var re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      var idx=0, m;
      while((m=re.exec(full))!==null){ f.fillers.push({word:w, pos:m.index}); if(idx++>50) break; }
    });
    /* 提问 + 候答 */
    var segs=parsed.segments;
    for(var i=0;i<segs.length;i++){
      var s=segs[i];
      if(s.isPause || !s.text) continue;
      if(/[？?]$/.test(s.text) || /什么|为什么|怎样|如何|哪里|哪些/.test(s.text) && /[吗呢吧啊]$/.test(s.text)){
        var q={ t:s.sec, ts:s.ts, text:s.text };
        f.questions.push(q); f.questionCount++;
        var wait=0, j=i+1;
        while(j<segs.length && segs[j].isPause){ wait+=segs[j].pauseSec; j++; }
        if(wait < 1.5){ f.waitIssues.push({ t:s.sec, ts:s.ts, text:s.text, wait:wait }); }
      }
    }
    /* 活动标记统计（真实稿：切换PPT/板书/视频/讨论/演示/提问等） */
    var actCount={};
    segs.forEach(function(s){ (s.activities||[]).forEach(function(a){ actCount[a]=(actCount[a]||0)+1; }); });
    f.activities=actCount;
    /* 板书标记识别（[板书：类别]内容，类别：课题/公式/关键词/图示） */
    var boardItems=[];
    segs.forEach(function(s){
      if(s.isPause) return;
      var bm=s.text.match(/\[板书[：:](课题|公式|关键词|图示)\]\s*(.*)/);
      if(bm){ boardItems.push({ cat:bm[1], text:(bm[2]||'').trim(), t:s.sec }); }
    });
    var boardCats={};
    boardItems.forEach(function(it){ boardCats[it.cat]=true; });
    var hasBoardAct = (actCount['板书']||0)>0;
    f.board={
      found: boardItems.length>0 || hasBoardAct,
      items: boardItems,
      hasTitle: !!boardCats['课题'],
      hasFormula: !!boardCats['公式'],
      hasKeyword: !!boardCats['关键词'],
      hasDiagram: !!boardCats['图示'],
      activityOnly: boardItems.length===0 && hasBoardAct
    };
    return f;
  },

  /* ===== 阶段4：学科错误匹配（detectTerms 语义等价，物理 + 其他学科） ===== */
  detectMisconceptions:function(parsed){
    var hits=[];
    var pool=(APP.KB.physicsMisconceptions||[]).concat(APP.KB.miscMisconceptions||[]);
    var seen={};
    parsed.segments.forEach(function(s){
      if(s.isPause || !s.text) return;
      var tx=APP.U.norm(s.text);
      if(!tx) return;
      pool.forEach(function(mc){
        if(seen[mc.id]) return;
        var terms=mc.detectTerms||[];
        var matched=null;
        for(var k=0;k<terms.length;k++){
          var nt=APP.U.norm(terms[k]);
          if(nt && tx.indexOf(nt)!==-1){ matched=terms[k]; break; }
        }
        if(matched){
          seen[mc.id]=true;
          hits.push({ mcId:mc.id, term:mc.topic||mc.term, topic:mc.topic, subject:mc.subject, detectTerm:matched, t:s.sec, ts:s.ts, quote:s.text, correct:mc.correct, fix:mc.fix });
        }
      });
    });
    return hits;
  },

  /* 环节完整性检测 */
  detectFlow:function(parsed){
    var text=parsed.segments.map(function(s){return s.text;}).join('');
    var flow={ import:false, develop:false, practice:false, summary:false };
    if(/今天|开始|上一节|先看|生活|现象|问题引入|情境|故事/.test(text)) flow.import=true;
    if(/概念|定义|规律|公式|定理|原理|那么|所以|我们来看/.test(text)) flow.develop=true;
    if(/练习|作业|做一做|试一试|请大家|回答|想一想|思考/.test(text)) flow.practice=true;
    if(/小结|总结|回顾|今天的内容|本节课|最后/.test(text)) flow.summary=true;
    return flow;
  },

  /* ===== 训练动作模板（按维度 id 索引） ===== */
  _actions:{
    lang:'按 160—260 字/分钟节奏重录本片段，剔除“然后/那个/呃”等口头禅',
    ask:'每提一问后停顿 3—5 秒再点答，用“等待—点答—追问”三拍节奏',
    board:'用“课题/图示/公式/关键词”四要素重构板书，边讲边写',
    flow:'按“导入—展开—练习—小结”四环节补齐流程，标注各环节用时',
    concept:'围绕迷思概念设计“呈现—证伪—纠错—回测”四步纠错教学',
    experiment:'补充演示实验或生活化模拟，明确操作规范与结论对应关系',
    logic:'用“因为—所以—由…得”链条显性化推导，板书每一步依据',
    inquiry:'把结论式提问改为“观察—猜想—验证”探究链，增加开放性问题'
  },

  /* ===== 阶段3：行为特征 -> 标准映射（rubrics 为唯一事实来源） ===== */
  mapToStandard:function(parsed, f){
    return (APP.KB.rubrics||[]).map(function(r){
      return { dimensionId:r.id, dimensionName:r.name, standardRef:r.desc||'', action:this._actions[r.id]||'' };
    }, this);
  },

  /* ===== 阶段5：证据校验（quote 必须可回原文，防幻觉） ===== */
  validateEvidence:function(parsed, problems){
    var corpus=parsed.segments.map(function(s){return s.text;}).join('\n');
    return problems.map(function(p){
      /* 设计上即为「证据不足」的问题（indeterminate 已由阶段8 标记）保持原样，basis 已写明理由 */
      if(p.indeterminate) return p;
      var ev=(p.evidence||[]).filter(function(x){
        return x && typeof x.quote==='string' && x.quote.length>0 && corpus.indexOf(x.quote)!==-1;
      });
      if(!ev.length){
        p.indeterminate=true;
        p.evidence=[];
        p.basis='转写证据不足，无法判定';
        p.confidence=Math.min(p.confidence||0, 0.3);
      } else {
        p.evidence=ev;
      }
      return p;
    });
  },

  /* ===== 阶段6：问题排序（kind -> severity -> 时间） ===== */
  rankProblems:function(problems){
    var kindOrder={ misconception:0, flow:1, board:2, behavior:3, indeterminate:4 };
    var sevOrder={ high:0, medium:1, low:2 };
    return problems.slice().sort(function(a,b){
      var ka=kindOrder[a.kind]!=null?kindOrder[a.kind]:9;
      var kb=kindOrder[b.kind]!=null?kindOrder[b.kind]:9;
      if(ka!==kb) return ka-kb;
      var sa=sevOrder[a.severity]!=null?sevOrder[a.severity]:3;
      var sb=sevOrder[b.severity]!=null?sevOrder[b.severity]:3;
      if(sa!==sb) return sa-sb;
      var ta=(a.evidence&&a.evidence[0]&&a.evidence[0].sec)||999;
      var tb=(b.evidence&&b.evidence[0]&&b.evidence[0].sec)||999;
      return ta-tb;
    });
  },

  /* ===== 阶段7：训练任务（幂等补充 action） ===== */
  attachAction:function(problems){
    return problems.map(function(p){
      if(!p.action) p.action=this._actions[p.dimensionId]||'对照标准观测点针对性改进';
      return p;
    }, this);
  },

  /* ===== 阶段8：组装 Problem（quote=原文子串、indeterminate=证据不足、standardRef=标准观测点） ===== */
  buildProblems:function(parsed, f, misconceptions, flow, speed, qpm){
    var self=this;
    var probs=[], n=0;
    function add(pr){
      pr.id='p_'+('000'+String(++n)).slice(-3);
      if(pr.confidence==null) pr.confidence=0.8;
      if(pr.severity==null) pr.severity='medium';
      if(pr.indeterminate==null) pr.indeterminate=false;
      probs.push(pr);
    }
    var std=this.mapToStandard(parsed, f);
    function ref(dimId){ for(var i=0;i<std.length;i++) if(std[i].dimensionId===dimId) return std[i].standardRef; return ''; }
    var segs=parsed.segments;
    var firstTalk=null;
    for(var i=0;i<segs.length;i++){ if(!segs[i].isPause && segs[i].text){ firstTalk=segs[i]; break; } }

    /* 1. 迷思概念 */
    misconceptions.forEach(function(h){
      add({
        kind:'misconception', dimensionId:'rub_d02', dimensionName:'教学目标与内容处理',
        standardRef:ref('rub_d02'),
        evidence:[{ quote:h.quote, t:h.ts, sec:h.t }],
        basis:'讲解中出现迷思概念“'+(h.topic||h.term)+'”，与“学科内容严谨无科学性错误”冲突',
        severity:'high', confidence:0.9,
        action:'针对“'+(h.topic||h.term)+'”设计“呈现—证伪—纠错—回测”四步纠错教学',
        misconception:{ term:h.term, topic:h.topic, correct:h.correct, fix:h.fix }
      });
    });

    /* 2. 语速 */
    if(speed<160 || speed>260){
      add({
        kind:'behavior', dimensionId:'rub_d01', dimensionName:'教师基本素养',
        standardRef:ref('rub_d01'),
        evidence: firstTalk?[{ quote:firstTalk.text, t:firstTalk.ts, sec:firstTalk.sec }]:[],
        basis:'实测语速 '+speed+' 字/分钟，'+(speed>260?'偏快':'偏慢')+'，超出 160—260 区间',
        severity: speed>260?'high':'medium', confidence:0.85,
        action:self._actions.lang
      });
    }

    /* 3. 填充词 */
    if(f.fillers.length>=3){
      var fillerSeg=null;
      for(var j=0;j<segs.length;j++){ if(!segs[j].isPause && segs[j].text && APP.KB.behaviorRules.fillerWords.some(function(w){return segs[j].text.indexOf(w)>=0;})){ fillerSeg=segs[j]; break; } }
      var dedup={}; f.fillers.forEach(function(x){ dedup[x.word]=(dedup[x.word]||0)+1; });
      var fs=Object.keys(dedup).map(function(k){return k+'×'+dedup[k];}).join('、');
      add({
        kind:'behavior', dimensionId:'rub_d01', dimensionName:'教师基本素养',
        standardRef:ref('rub_d01'),
        evidence: fillerSeg?[{ quote:fillerSeg.text, t:fillerSeg.ts, sec:fillerSeg.sec }]:[],
        basis:'共出现 '+f.fillers.length+' 次填充词（'+fs+'）',
        severity:'low', confidence:0.8,
        action:self._actions.lang
      });
    }

    /* 4. 候答不足 */
    if(f.waitIssues.length>0){
      var w0=f.waitIssues[0];
      add({
        kind:'behavior', dimensionId:'rub_d03', dimensionName:'课堂实施与师生互动',
        standardRef:ref('rub_d03'),
        evidence:[{ quote:w0.text, t:w0.ts, sec:w0.t }],
        basis:'有 '+f.waitIssues.length+' 次提问候答不足 1.5 秒即继续',
        severity:'medium', confidence:0.85,
        action:self._actions.ask
      });
    }

    /* 5. 提问频次低 */
    if(qpm<1){
      add({
        kind:'behavior', dimensionId:'rub_d03', dimensionName:'课堂实施与师生互动',
        standardRef:ref('rub_d03'),
        evidence: firstTalk?[{ quote:firstTalk.text, t:firstTalk.ts, sec:firstTalk.sec }]:[],
        basis:'有效提问约 '+qpm+' 次/分钟，低于 1 次/分钟',
        severity:'low', confidence:0.7,
        action:self._actions.inquiry
      });
    }

    /* 6. 板书 */
    var board=f.board||{found:false,items:[]};
    if(!board.found){
      add({
        kind:'board', dimensionId:'rub_d01', dimensionName:'教师基本素养',
        standardRef:ref('rub_d01'),
        evidence: firstTalk?[{ quote:firstTalk.text, t:firstTalk.ts, sec:firstTalk.sec }]:[],
        basis:'全文未见板书标记，无法验证板书呈现质量',
        severity:'medium', confidence:0.7,
        action:self._actions.board
      });
    } else if(board.activityOnly){
      /* 有板书活动标记，但未记录具体板书内容 -> 证据不足，无法判定四要素覆盖度 */
      add({
        kind:'indeterminate', dimensionId:'rub_d01', dimensionName:'教师基本素养',
        standardRef:ref('rub_d01'),
        evidence: [],
        basis:'转写稿记录了板书活动，但未记录板书具体内容（课题/公式/关键词/图示），无法判定板书四要素覆盖度',
        severity:'low', confidence:0.3, indeterminate:true,
        action:self._actions.board
      });
    } else {
      var missing=[];
      if(!board.hasTitle) missing.push('课题');
      if(!board.hasFormula) missing.push('核心公式');
      if(!board.hasKeyword) missing.push('关键词');
      if(!board.hasDiagram) missing.push('图示');
      if(missing.length){
        /* 选第一个含非空文本的板书条目作证据，避免空 quote 被证据校验误杀 */
        var evItem=null;
        for(var bi=0; bi<board.items.length; bi++){ if(board.items[bi] && board.items[bi].text){ evItem=board.items[bi]; break; } }
        var ev=evItem?[{ quote:evItem.text, t:evItem.ts||APP.U.fmtTime(evItem.t), sec:evItem.t }]:[];
        add({
          kind: ev? 'board':'indeterminate', dimensionId:'rub_d01', dimensionName:'教师基本素养',
          standardRef:ref('rub_d01'),
          evidence: ev,
          basis: ev? ('板书缺失要素：'+missing.join('、')) : '板书条目未记录具体内容，无法判定板书四要素覆盖度',
          severity:'low', confidence: ev? 0.75:0.3, indeterminate: !ev,
          action: ev? ('补充板书类别：'+missing.join('、')) : self._actions.board
        });
      }
    }

    /* 7. 环节缺失 */
    var miss=[];
    if(!flow.import) miss.push('情境导入');
    if(!flow.develop) miss.push('新知讲解');
    if(!flow.practice) miss.push('课堂练习');
    if(!flow.summary) miss.push('课堂小结');
    if(miss.length){
      add({
        kind:'flow', dimensionId:'rub_d03', dimensionName:'课堂实施与师生互动',
        standardRef:ref('rub_d03'),
        evidence: firstTalk?[{ quote:firstTalk.text, t:firstTalk.ts, sec:firstTalk.sec }]:[],
        basis:'缺失教学环节：'+miss.join('、'),
        severity:'medium', confidence:0.8,
        action:'补齐缺失环节：'+miss.join('、')
      });
    }

    /* 8. 实验证据不足（indeterminate） */
    add({
      kind:'indeterminate', dimensionId:'rub_d04', dimensionName:'教学方法与教学手段',
      standardRef:ref('rub_d04'),
      evidence: [],
      basis:'转写稿未含实验操作信息，无法判定实验规范性',
      severity:'low', confidence:0.3, indeterminate:true,
      action:self._actions.experiment
    });

    /* 9. 逻辑推导（定位含因果推导标记的片段作证据，避免证据空数组被误判） */
    var logicRe=/(因为|所以|因此|由.{0,4}得|根据.{0,6}(可知|可得)|推导|得出)/;
    var logicSeg=null;
    for(var li=0; li<segs.length; li++){
      if(!segs[li].isPause && logicRe.test(segs[li].text)){ logicSeg=segs[li]; break; }
    }
    var hasLogic=!!logicSeg;
    add({
      kind:'indeterminate', dimensionId:'rub_d05', dimensionName:'思维与育人表现',
      standardRef:ref('rub_d05'),
      evidence: logicSeg?[{ quote:logicSeg.text, t:logicSeg.ts, sec:logicSeg.sec }]:[],
      basis: hasLogic?'检测到因果推导标记，推导链基本完整（注意前提条件）':'转写稿未见显式推导链条，无法判定逻辑推导质量',
      severity:'low', confidence: hasLogic?0.6:0.3, indeterminate: !hasLogic,
      action:self._actions.logic
    });

    return this.validateEvidence(parsed, probs);
  },

  /* 生成诊断报告 */
  diagnose:function(parsed, opts){
    opts=opts||{};
    var f=this.features(parsed);
    var misconceptions=this.detectMisconceptions(parsed);
    var flow=this.detectFlow(parsed);
    var durMin=Math.max(parsed.durationSec,1)/60;
    var speed=Math.round(parsed.wordCount/durMin);
    var qpm=Math.round(f.questionCount/durMin*10)/10;

    var dims=[];
    /* 语速 sub */
    var speedSub=100, speedEv=[];
    if(speed<160 || speed>260){ speedSub -= (speed>260?18:12); speedEv.push({t:'—',txt:'语速 '+speed+' 字/分钟'+(speed>260?'（偏快）':'（偏慢）')}); }
    /* 填充词 sub */
    var fillerSub=100, fillerEv=[];
    if(f.fillers.length>0){ var dedup={}; f.fillers.forEach(function(x){dedup[x.word]=(dedup[x.word]||0)+1;}); var fs=Object.keys(dedup).map(function(k){return k+'×'+dedup[k];}).join('、'); fillerSub-=Math.min(30,f.fillers.length*3); fillerEv.push({t:'—',txt:'填充词共 '+f.fillers.length+' 次（'+fs+'）'}); }
    /* 提问候答 sub */
    var askSub=100, askEv=[];
    if(f.waitIssues.length>0){ askSub-=Math.min(30,f.waitIssues.length*10); }
    if(qpm<1){ askSub-=15; }
    askEv=f.waitIssues.slice(0,3).map(function(w){ return {t:APP.U.fmtTime(w.t),txt:'候答不足 1.5 秒（约 '+w.wait+' 秒）：「'+w.text.slice(0,18)+'…」'}; });
    if(f.questionCount===0) askEv.push({t:'—',txt:'未检测到有效提问'});

    /* 板书 sub */
    var board=f.board||{ found:false, items:[], hasTitle:false, hasFormula:false, hasKeyword:false, hasDiagram:false };
    var boardSub, boardEv=[], boardAct=[];
    if(!board.found){
      boardSub=70;
      boardEv=[{t:'—',txt:'转写稿不含板书画面，建议录制视频或补充 [板书] 标记以获得真实评分'}];
      boardAct=['板书课题、核心公式与关键词'];
    } else {
      var boardCatCount=(board.hasTitle?1:0)+(board.hasFormula?1:0)+(board.hasKeyword?1:0)+(board.hasDiagram?1:0);
      boardSub=APP.U.clamp(40 + 15*boardCatCount, 10, 100);
      boardEv=board.items.map(function(it){ return { t:APP.U.fmtTime(it.t), txt:'['+it.cat+'] '+it.text }; });
      var boardMissing=[];
      if(!board.hasTitle) boardMissing.push('课题');
      if(!board.hasFormula) boardMissing.push('核心公式');
      if(!board.hasKeyword) boardMissing.push('关键词');
      if(!board.hasDiagram) boardMissing.push('图示');
      if(boardMissing.length) boardAct.push('补充板书类别：'+boardMissing.join('、'));
      if(board.hasDiagram) boardAct.push('图示类板书体现了画面利用率，继续保持');
      if(board.items.length<3) boardAct.push('重点内容及时上板');
    }

    /* 环节 sub */
    var flowSub=40, flowMiss=[];
    if(!flow.import) flowMiss.push('情境导入'); if(!flow.develop) flowMiss.push('新知讲解'); if(!flow.practice) flowMiss.push('课堂练习'); if(!flow.summary) flowMiss.push('课堂小结');
    flowSub += (4-flowMiss.length)*15;

    /* 概念科学性 sub（物理专项二级观测点） */
    var conceptSub=100, conceptEv=[];
    if(misconceptions.length){ conceptSub-=Math.min(40,misconceptions.length*15); conceptEv=misconceptions.slice(0,4).map(function(m){ return {t:APP.U.fmtTime(m.t),txt:'涉及迷思概念「'+m.term+'」：「'+m.quote.slice(0,22)+'…」'}; }); }
    /* 实验/方法 sub（物理专项二级观测点） */
    var actText=Object.keys(f.activities||{}).join('、');
    var expSub=/演示|实验|播放视频|操作|器材/.test(actText)?82:68;
    /* 逻辑推导 sub */
    var logicSub=/推导|证明|因为|所以|因此|公式|定律|前提|条件|量纲|单位/.test(parsed.raw||'')?84:72;
    /* 育人 sub */
    var eduSub=/素养|立德|育人|科学精神|爱国|合作|探究|严谨|实事求是|价值观|社会责任/.test(parsed.raw||'')?85:72;

    /* ===== 五维加权聚合 ===== */
    var d01=Math.round(0.4*speedSub+0.3*fillerSub+0.3*boardSub);
    var d02=Math.round(0.6*conceptSub+0.4*flowSub);
    var d03=Math.round(0.35*flowSub+0.45*askSub+0.2*(qpm>=1?80:60));
    var d04=expSub;
    var d05=Math.round(0.5*logicSub+0.5*eduSub);
    dims.push({ id:'rub_d01', name:'教师基本素养', group:'通用', physics:false, weight:20, score:APP.U.clamp(d01,10,100), evidence:speedEv.concat(fillerEv,boardEv), actions:(speed>260?['放慢语速，控制在 160—260 字/分钟']:[]).concat(fillerEv.length?['减少"然后/那个/呃"等填充词']:[],boardAct) });
    dims.push({ id:'rub_d02', name:'教学目标与内容处理', group:'通用', physics:true, weight:22, score:APP.U.clamp(d02,10,100), evidence:conceptEv.length?conceptEv:[{t:'—',txt:'未检测到物理迷思概念表述'}], actions:misconceptions.length?['主动辨析并纠正迷思概念（见报告"迷思概念明细"）']:['保持概念表述的科学严谨'] });
    dims.push({ id:'rub_d03', name:'课堂实施与师生互动', group:'通用', physics:false, weight:28, score:APP.U.clamp(d03,10,100), evidence:(flowMiss.length?[{t:'—',txt:'缺失环节：'+flowMiss.join('、')}]:[{t:'—',txt:'导入—新授—练习—小结环节完整'}]).concat(askEv), actions:(flowMiss.length?['补齐缺失环节：'+flowMiss.join('、')]:[]).concat(f.waitIssues.length?['提问后默数 2—3 秒再指名回答']:[]) });
    dims.push({ id:'rub_d04', name:'教学方法与教学手段', group:'通用', physics:true, weight:18, score:APP.U.clamp(d04,10,100), evidence:[{t:'—',txt:'据活动标记（演示/实验/视频/操作）与信息化手段评估'}], actions:['明确实验目的、步骤、现象与结论对应','恰当运用教具与信息化素材突破重难点'] });
    dims.push({ id:'rub_d05', name:'思维与育人表现', group:'通用', physics:false, weight:12, score:APP.U.clamp(d05,10,100), evidence:[{t:'—',txt:'逻辑推导链与育人渗透综合评估'}], actions:['推导前明确前提条件与物理量','在教学中渗透核心素养与立德树人'] });

    /* 归一化：确保 actions/evidence 均为数组 */
    dims.forEach(function(d){ d.actions=Array.isArray(d.actions)?d.actions:(d.actions?[d.actions]:[]); d.evidence=Array.isArray(d.evidence)?d.evidence:(d.evidence?[d.evidence]:[]); });
    var totalWeighted=0; dims.forEach(function(d){ totalWeighted += d.score*d.weight; });
    var avg=Math.round(totalWeighted/100);
    var band=APP.KB.gradeBands[0];
    for(var bi=0; bi<APP.KB.gradeBands.length; bi++){ if(avg>=APP.KB.gradeBands[bi].min && avg<=APP.KB.gradeBands[bi].max){ band=APP.KB.gradeBands[bi]; break; } }
    var topActions=[];
    dims.slice().sort(function(a,b){return a.score-b.score;}).slice(0,3).forEach(function(d){ topActions=topActions.concat(d.actions.slice(0,1)); });

    /* 唯一优先训练目标：五项能力中得分最低者，作为本轮唯一训练任务（贯穿学生模拟与重讲对比） */
    var focus=dims.slice().sort(function(a,b){return a.score-b.score;})[0];
    var focusAction=(focus.actions&&focus.actions[0])?focus.actions[0]:'针对性改进该项能力';
    var focusEv=(focus.evidence||[]).slice(0,2).map(function(e){return e.txt;}).join('；');
    var priority={
      dimensionId:focus.id,
      dimensionName:focus.name,
      score:focus.score,
      weight:focus.weight,
      action:focusAction,
      actions:(focus.actions||[]).slice(0,3),
      evidence:(focus.evidence||[]).slice(0,3),
      why:'「'+focus.name+'」得分 '+focus.score+' 分，在五项能力中最低（权重 '+focus.weight+'%），是当前最拖后腿的能力。'+(focusEv?('证据：'+focusEv+'。'):'')+'因此本轮唯一训练任务是：'+focusAction+'。'
    };

    /* 8 步管线：问题组装 -> 证据校验 -> 排序 -> 训练动作 */
    var problems=this.attachAction(this.rankProblems(this.buildProblems(parsed, f, misconceptions, flow, speed, qpm)));

    return {
      meta:{ speed:speed, wordCount:parsed.wordCount, durationSec:parsed.durationSec, questionCount:f.questionCount, qpm:qpm, fillerCount:f.fillers.length, waitIssueCount:f.waitIssues.length },
      problems:problems,
      dimensions:dims,
      misconceptions:misconceptions,
      flow:flow,
      avg:avg,
      grade:band.level,
      gradeBand:band,
      priority:priority,
      topActions:topActions,
      needsReview: misconceptions.length>0 || avg<60 || problems.some(function(p){return p.severity==='high' && !p.indeterminate;})
    };
  }
};

/* ===================== #region L3 AI 学生模拟器 ===================== */

/* ===== L2.5 学生行为状态机（AI 学生行为的唯一决策层，离线/在线共享） =====
 * 职责：决定每个回合的 behavior / question_type / state，输出结构化 intent。
 * 人格只提供行为倾向 behavior_bias；问题库只提供可选题（按 question_type 检索）；
 * 二者通过 question_type 解耦，不按 persona_id 硬绑定。
 * 云端（DeepSeek）只负责把 intent 自然语言化，不得更改行为意图。
 */
APP.StudentStateMachine = {
  STATES: ['attentive','distracted','confused','curious','skeptical','excited'],
  BEHAVIORS: ['respond','question','interrupt','wander','emergency'],

  /* 从教师消息推断课堂情境特征 */
  detectFeatures: function(text){
    var t = String(text||'');
    return {
      isQuestion:   /[？?]$/.test(t) || /什么|为什么|怎样|如何|想一想|回答|哪些|是不是|能不能|讨论|大家|谁愿意/.test(t),
      isExperiment: /实验|演示|操作|器材|纸带|打点|计时器|测量|释放|观察|现象|温度计|天平|酒精灯|硬币|纸团/.test(t),
      isLifeScene:  /生活|现实|平时|日常|看到|雨滴|树叶|雪花|瀑布|石头|硬币|纸片|自行车|柜子|跳伞|哈气|尺子/.test(t),
      isPrinciple:  /公式|定义|原理|规律|推导|证明|条件|定律|定理|变加速|匀加速|怎么得出/.test(t),
      isSummary:    /总结|小结|回顾|梳理|记住|重点|本节课/.test(t),
      isConclusion: /所以|因此|那么|结论|正确|没错|对！|就是/.test(t)
    };
  },

  /* 按人设行为倾向的权重随机选 question_type（人格决定倾向，不绑定具体题） */
  pickQuestionType: function(persona){
    var w = persona.behavior_bias.question_type_weights;
    var keys = Object.keys(w), total = 0, i;
    for(i=0;i<keys.length;i++) total += w[keys[i]];
    var r = Math.random()*total, acc = 0;
    for(i=0;i<keys.length;i++){ acc += w[keys[i]]; if(r<=acc) return keys[i]; }
    return keys[keys.length-1];
  },

  /* 从题库按 question_type 抽题（persona_id 仅作来源标注，不作绑定键） */
  pickQuestion: function(sim, qtype){
    var pool = APP.KB.studentQuestions.filter(function(q){ return q.question_type===qtype; });
    if(!pool.length) pool = APP.KB.studentQuestions;
    var used = sim.usedQuestionIds || (sim.usedQuestionIds={});
    var fresh = pool.filter(function(q){ return !used[q.id]; });
    var q = (fresh.length ? fresh : pool)[Math.floor(Math.random()*(fresh.length?fresh.length:pool.length))];
    used[q.id] = true;
    if(Object.keys(used).length >= APP.KB.studentQuestions.length) sim.usedQuestionIds = {};
    return q;
  },

  /* 决策核心：输入上下文，输出行为意图 intent（离线/在线唯一入口） */
  decide: function(ctx){
    var sim = ctx.sim, persona = sim.persona, bias = persona.behavior_bias||{};
    var t = String(ctx.message||'').trim();
    var feats = this.detectFeatures(t);
    var intent = { behavior:'respond', question_type:null, state:'attentive', question:null, topic:ctx.topic||'', reason:'', text:'', sys:null };

    /* 1. 外部事件优先抢占（突发事件 / 迷思概念注入） */
    if(ctx.externalEvent){
      var ev = ctx.externalEvent;
      intent.behavior = ev.type==='emergency' ? 'emergency' : 'question';
      intent.state = ev.type==='emergency' ? 'excited' : 'confused';
      intent.text = ev.text; intent.sys = ev.sys;
      intent.triggerLabel = ev.type==='emergency' ? '课堂突发' : '迷思概念质疑';
      intent.reason = ev.type==='emergency' ? ('突发事件外部事件输入：'+ev.kind) : '迷思概念外部事件输入';
      return intent;
    }

    /* 2. 教师表述触发迷思概念 -> 学生质疑（训练纠错，detectTerms 语义等价匹配） */
    var mc = APP.KB.physicsMisconceptions.find(function(m){
      var nt = APP.U.norm(t);
      if(!nt) return false;
      return (m.detectTerms||[]).some(function(k){
        var nk = APP.U.norm(k);
        return nk && nt.indexOf(nk)!==-1;
      });
    });
    if(mc){
      intent.behavior='question'; intent.state='confused';
      intent.text = mc.studentLine; intent.sys = '学生抛出迷思概念：「'+mc.term+'」——请用科学表述纠正。';
      intent.triggerLabel = '迷思概念质疑';
      intent.reason = '教师表述触发迷思概念质疑';
      return intent;
    }

    /* 3. 按情境 + 人设倾向决定行为与状态 */
    if(feats.isExperiment){
      intent.state='excited'; intent.behavior='question'; intent.question_type='experiment';
      intent.reason='实验情境触发';
    } else if(feats.isLifeScene){
      intent.state='skeptical'; intent.behavior='question'; intent.question_type='life_intuition';
      intent.reason='生活场景触发';
    } else if(feats.isPrinciple){
      intent.state='curious'; intent.behavior='question'; intent.question_type='extension';
      intent.reason='原理/公式触发';
    } else if(feats.isQuestion){
      intent.state='attentive';
      intent.question_type = this.pickQuestionType(persona);
      intent.behavior='question';
      intent.reason='教师提问，按人设行为倾向抽题';
    } else if(feats.isSummary || feats.isConclusion){
      intent.state='attentive'; intent.behavior='respond';
      intent.reason='总结/结论，学生确认';
    } else {
      /* 默认讲授：按人设走神/插话倾向 */
      var longLecture = (sim.turn>0 && sim.turn%3===0);
      if(longLecture && Math.random() < (bias.wander_prob||0.1)){
        intent.behavior='wander'; intent.state='distracted';
        intent.reason='连续讲授触发走神倾向';
      } else if(Math.random() < (bias.interrupt_prob||0.15)){
        intent.behavior='interrupt'; intent.state='curious';
        intent.question_type = this.pickQuestionType(persona);
        intent.reason='插话倾向触发，按人设抽题';
      } else {
        intent.behavior='respond'; intent.state='attentive';
        intent.reason='专注听讲，简短应答';
      }
    }

    /* 4. 提问/插话类行为：从题库抽题（不按 persona_id 绑定） */
    if((intent.behavior==='question' || intent.behavior==='interrupt') && intent.question_type && !intent.text){
      var q = this.pickQuestion(sim, intent.question_type);
      intent.question = q;
      intent.text = q.question;
      intent.topic = q.topic;
    }
    return intent;
  }
};

APP.Simulator = {
  make:function(personaId){
    var p=APP.KB.studentPersonas.find(function(x){return x.id===personaId;})||APP.KB.studentPersonas[0];
    /* 针对本轮唯一优先训练目标定制挑战：把与该能力相关的事件排到最前 */
    var pri=(APP.state.context.diagnosis&&APP.state.context.diagnosis.priority)||null;
    var plan=pri?(APP.KB.focusPlan[pri.dimensionId]||null):null;
    var events=APP.KB.classroomEvents.slice();
    if(plan){
      events.sort(function(a,b){
        var ha=plan.eventKeys.some(function(k){return a.kind.indexOf(k)>=0;});
        var hb=plan.eventKeys.some(function(k){return b.kind.indexOf(k)>=0;});
        return (hb?1:0)-(ha?1:0);
      });
    }
    return { persona:p, turn:0, messages:[], eventQueue:events.slice(0,3), conceptIndex:0, lastTrigger:'', usedQuestionIds:{}, currentState:'attentive', focus:pri, plan:plan };
  },

  /* 通用应答台词（按状态）；人格差异主要由 question 行为（按 question_type 抽题）体现 */
  _stateLines: {
    attentive:'（认真听讲）嗯，明白了。',
    distracted:'（走神被叫到）啊？老师，我刚刚没跟上……',
    confused:'老师，这里我有点没听懂……',
    curious:'老师，那这个是怎么回事呢？',
    skeptical:'老师，可是我觉得好像不是这样的……',
    excited:'哇，这个好有意思！'
  },

  /* 把决策层输出的 intent 渲染成学生文本（离线表达层） */
  renderIntent: function(sim, intent){
    var out = { who:'student', text:'', sys:intent.sys||null, trigger:intent.triggerLabel||'', intent:intent };
    if(intent.triggerLabel){
      out.text = intent.text || this._stateLines[intent.state] || '';
      sim.currentState = intent.state;
      return out;
    }
    switch(intent.behavior){
      case 'question':
        out.text = intent.text || '老师，我有个问题……';
        out.trigger = '提问·'+(intent.question_type||'');
        break;
      case 'emergency':
        out.text = intent.text || '老师，出状况了！';
        out.trigger = '课堂突发';
        break;
      case 'wander':
        out.text = intent.text || this._stateLines.distracted;
        out.trigger = '走神';
        break;
      case 'interrupt':
        out.text = intent.text || '老师，我插一句……';
        out.trigger = '插话·'+(intent.question_type||'');
        break;
      case 'respond':
      default:
        out.text = this._stateLines[intent.state] || this._stateLines.attentive;
        out.trigger = '应答·'+intent.state;
    }
    sim.currentState = intent.state;
    return out;
  },

  /* 当前课程主题 */
  _topic:function(){
    var lesson = APP.state && APP.state.context && APP.state.context.lesson;
    return (lesson && lesson.title) || (APP.KB.sampleLesson && APP.KB.sampleLesson.title) || '';
  },

  /* 离线回应：decide -> renderIntent（共享状态机） */
  respond:function(sim, userText){
    var intent = APP.StudentStateMachine.decide({ sim:sim, message:userText, topic:APP.Simulator._topic() });
    sim.turn++;
    return APP.Simulator.renderIntent(sim, intent);
  },

  /* 云端回应：先 decide 得意图（仅一次），再让 DeepSeek 仅做自然语言化表达；失败降级本地。
   * 关键：在线失败时复用已 decide 的 intent 本地措辞，绝不二次咨询状态机（避免状态漂移）。 */
  respondRemote:function(sim, userText, done){
    if(!APP.Settings.isOnline()){
      var rOff=APP.Simulator.respond(sim,userText);
      if(done) done(rOff,'local');
      return rOff;
    }
    var intent;
    try{
      intent = APP.StudentStateMachine.decide({ sim:sim, message:userText, topic:APP.Simulator._topic() });
    }catch(e){
      /* decide 异常：交给 respond 重试一次（异常场景兜底，仍在同一 respond 内完成） */
      var r0=APP.Simulator.respond(sim,userText);
      if(done) done(r0,'local');
      return r0;
    }
    /* 本地降级：复用已 decide 的 intent，不再二次 decide */
    var localFallback=function(){
      sim.turn++;
      var r=APP.Simulator.renderIntent(sim,intent);
      if(done) done(r,'local');
      return r;
    };
    try{
      var lesson=APP.state.context.lesson;
      var history=sim.messages.slice(-8).map(function(m){
        return { role:(m.who==='student'?'student':'teacher'), text:m.text };
      });
      fetch(APP.CLOUD.workerUrl+'/api/simulate', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          personaId: sim.persona.id,
          personaName: sim.persona.name,
          personaStyle: sim.persona.style,
          personaCatchphrase: sim.persona.catchphrase||'',
          subject: (APP.KB.sampleLesson&&APP.KB.sampleLesson.subject)||'物理',
          topic: (lesson&&lesson.title)||'',
          history: history,
          message: userText,
          intent: {
            behavior: intent.behavior,
            question_type: intent.question_type,
            state: intent.state,
            questionText: intent.text || '',
            topic: intent.topic || ''
          }
        })
      }).then(function(r){ return r.ok? r.json() : Promise.reject(new Error('HTTP '+r.status)); })
        .then(function(d){
          if(d && d.text){
            sim.turn++;
            sim.currentState = intent.state;
            done({ text:d.text, sys:d.sys||null, trigger:d.trigger||('云端·'+intent.behavior), intent:intent }, 'cloud');
            return d;
          }
          return localFallback();
        })
        .catch(function(){ APP.Toast.show('在线学生服务不可用，已使用本地学生规则','warn'); localFallback(); });
    }catch(e){ localFallback(); }
  }
};

/* ===================== #region 模拟课堂本地分析器（UI-SIM） =====================
 * 说明：
 *   - 只整理本轮课堂互动记录并给出训练提示，不参与 5 维评分、不改动评分算法。
 *   - 本轮不调用云端：/api/analyze 是「试讲转写诊断」接口，不是模拟课堂分析接口（R3）。
 *   - 未来如需云端模拟课堂分析，应另行设计 /api/sim-analyze，本轮不实现。
 */
APP.SimAnalyzer = {
  _firstTeacherAfter:function(msgs, idx){
    for(var i=idx+1;i<msgs.length;i++) if(msgs[i].who==='teacher') return { i:i, text:msgs[i].text };
    return null;
  },
  _termOf:function(sysText){
    var m=/「([^」]+)」/.exec(String(sysText||''));
    return m?m[1]:'';
  },
  analyze:function(sim){
    var msgs=(sim&&sim.messages)||[], items=[], self=this;
    /* 1. 本轮训练目标：直接来自已有诊断 priority，不重新评分 */
    var focus=(sim&&sim.focus)||null;
    if(focus&&focus.action){
      items.push({ title:focus.action, next:focus.action, evidenceIndex:null, evidenceText:'' });
    }
    /* 2. 学生抛出迷思概念后是否给出科学纠正 */
    msgs.forEach(function(m,i){
      if(m.who!=='sys'||m.text.indexOf('迷思概念')<0) return;
      var term=self._termOf(m.text), stu=null, j;
      for(j=i+1;j<msgs.length;j++){ if(msgs[j].who==='student'){ stu={i:j,text:msgs[j].text}; break; } }
      if(self._firstTeacherAfter(msgs, stu?stu.i:i)) return;
      items.push({ title:'学生抛出「'+term+'」后，没有给出科学纠正',
        evidenceText:stu?stu.text:m.text, evidenceIndex:stu?stu.i:i,
        next:'先肯定学生的质疑，再用前提条件与物理量给出正确结论，并说明原表述错在哪里。' });
    });
    /* 3. 课堂突发是否处理 */
    msgs.forEach(function(m,i){
      if(m.who!=='sys'||m.text.indexOf('突发事件')<0) return;
      if(self._firstTeacherAfter(msgs,i)) return;
      items.push({ title:'课堂突发出现后，没有给出应对策略',
        evidenceText:m.text, evidenceIndex:i,
        next:'先用一句话稳住课堂秩序，再把突发转为教学契机，最后回到本节主线。' });
    });
    /* 4. 是否收束到明确小结 */
    var tIdx=[]; msgs.forEach(function(m,i){ if(m.who==='teacher') tIdx.push(i); });
    if(tIdx.length){
      var last=msgs[tIdx[tIdx.length-1]].text;
      if(!/总结|小结|回顾|梳理|本节课|今天我们/.test(last)){
        items.push({ title:'课堂没有收束到一个明确的小结',
          evidenceText:last, evidenceIndex:tIdx[tIdx.length-1],
          next:'用 30 秒回顾本节核心结论与易错点，再结束本轮。' });
      }
    }
    /* 5. 提问后是否给学生的回答明确反馈 */
    var asked=false, feedback=false;
    msgs.forEach(function(m){
      if(m.who!=='teacher') return;
      if(/[？?]/.test(m.text)) asked=true;
      if(/很好|不错|说得对|请坐|这个想法|你的思路/.test(m.text)) feedback=true;
    });
    if(asked&&!feedback){
      items.push({ title:'提问后没有给学生的回答明确反馈',
        evidenceText:'（本轮记录中未见「很好 / 不错 / 请坐」等反馈语）', evidenceIndex:null,
        next:'学生回答后先复述要点，再肯定或纠正，最后补充完整表述。' });
    }
    return { src:'local', items:items.slice(0,3) };
  }
};

/* ===================== #region L3 雷达图 ===================== */
APP.Radar = {
  data:function(dims){
    return dims.map(function(d){ return { name:d.name, score:d.score }; });
  },
  _css:function(name, def){
    /* 从 :root 读取 CSS 变量（2.5D 几何参数），浏览器不可用（Node 测试）时回退默认值 */
    var v=def;
    if(typeof document!=='undefined' && document.documentElement && document.defaultView){
      var raw=document.defaultView.getComputedStyle(document.documentElement).getPropertyValue(name);
      if(raw){ var num=parseFloat(raw); if(!isNaN(num)) v=num; }
    }
    return v;
  },
  render:function(dimA, dimB, width, height){
    var n=dimA.length; if(!n) return '<div class="muted">暂无数据</div>';
    /* 宽度不足自动降级为干净 2D：depth/backOffset 归零 */
    var d2 = width < 340;
    var depthX = d2?0:this._css('--rd-depth-x', 7);
    var depthY = d2?0:this._css('--rd-depth-y', 7);
    var backOff = d2?0:this._css('--rd-back-offset', 11);
    var gridOp = d2?0.4:this._css('--rd-grid-opacity', 0.5);
    var MAIN='#185fa5', AUX='#2E8B80';                 /* 深学术蓝 / 克制青 */
    var cx=(width-backOff)/2, cy=(height-backOff)/2;
    var R=Math.min(width,height)/2-46-backOff; if(R<36) R=36;
    var a0=-Math.PI/2, step=Math.PI*2/n;

    function rgba(hex,a){ var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
    function P(k,i,ox,oy){ var r=R*k; return {x:cx+r*Math.cos(a0+i*step)+ox, y:cy+r*Math.sin(a0+i*step)+oy}; }
    function ring(k,ox,oy){ var a=[]; for(var i=0;i<n;i++){var p=P(k,i,ox,oy); a.push(p.x.toFixed(1)+','+p.y.toFixed(1));} return a.join(' '); }
    function poly(ds,ox,oy){ var a=[]; for(var i=0;i<n;i++){var p=P((ds[i].score||0)/100,i,ox,oy); a.push(p.x.toFixed(1)+','+p.y.toFixed(1));} return a.join(' '); }
    function sides(ds,ox,oy,fill){ var a=[]; for(var i=0;i<n;i++){ var j=(i+1)%n;
      var f0=P((ds[i].score||0)/100,i,0,0), f1=P((ds[j].score||0)/100,j,0,0);
      var b1=P((ds[j].score||0)/100,j,ox,oy), b0=P((ds[i].score||0)/100,i,ox,oy);
      a.push('<polygon points="'+f0.x.toFixed(1)+','+f0.y.toFixed(1)+' '+f1.x.toFixed(1)+','+f1.y.toFixed(1)+' '+b1.x.toFixed(1)+','+b1.y.toFixed(1)+' '+b0.x.toFixed(1)+','+b0.y.toFixed(1)+'" fill="'+fill+'"/>'); }
      return a.join(''); }
    function scolor(s){ if(s>=80)return '#2E8B80'; if(s>=60)return '#2C7A9D'; if(s>=40)return '#C77A2E'; return '#C0392B'; }
    function node(p,color,score,name,r){
      return '<g class="rd-node" style="color:'+color+'" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">'
        +'<circle class="rd-ring" r="'+(r+5)+'" fill="currentColor"/>'
        +'<circle class="rd-core" r="'+r+'" fill="#fff" stroke="currentColor"/>'
        +'<title>'+APP.U.esc(name)+' · '+score+' 分</title></g>';
    }

    var s='<svg class="radar-svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="能力雷达图">';

    /* 后方五边形背板（背板偏移，提供 2.5D 纵深） */
    if(backOff>0){ s+='<polygon points="'+ring(1,backOff,backOff)+'" fill="#eef4f9" stroke="#dbe4ee" stroke-width="1"/>'; }
    /* 4 层浅网格 + 5 条主轴 */
    [0.25,0.5,0.75,1].forEach(function(k){ s+='<polygon points="'+ring(k,0,0)+'" fill="none" stroke="#c9d6e2" stroke-width="1" stroke-opacity="'+gridOp+'"/>'; });
    for(var i=0;i<n;i++){ var tp=P(1,i,0,0); s+='<line x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+tp.x.toFixed(1)+'" y2="'+tp.y.toFixed(1)+'" stroke="#c9d6e2" stroke-width="1" stroke-opacity="'+gridOp+'"/>'; }

    /* 主数据层（深学术蓝，轻微挤出厚度：背面 + 侧面 + 正面） */
    if(depthX||depthY){
      s+='<polygon points="'+poly(dimA,depthX,depthY)+'" fill="'+rgba(MAIN,0.10)+'" stroke="none"/>';
      s+=sides(dimA,depthX,depthY,rgba(MAIN,0.14));
    }
    s+='<polygon points="'+poly(dimA,0,0)+'" fill="'+rgba(MAIN,0.18)+'" stroke="'+MAIN+'" stroke-width="2" stroke-linejoin="round"/>';

    /* 辅助/对比层（克制青色，扁平半透明覆盖） */
    if(dimB){ s+='<polygon points="'+poly(dimB,0,0)+'" fill="'+rgba(AUX,0.15)+'" stroke="'+AUX+'" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/>'; }

    /* 标签（平面朝向，清晰）+ 分值 + 可 hover 节点 */
    for(var j=0;j<n;j++){
      var lx=cx+(R+18)*Math.cos(a0+j*step), ly=cy+(R+18)*Math.sin(a0+j*step);
      var anchor = lx<cx-6?'end':(lx>cx+6?'start':'middle');
      s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" font-size="11" fill="#4a5a6a" text-anchor="'+anchor+'">'+APP.U.esc(dimA[j].name)+'</text>';
      var np=P((dimA[j].score||0)/100,j,0,0);
      var dx=Math.cos(a0+j*step), dy=Math.sin(a0+j*step);
      s+='<text x="'+(np.x+dx*14).toFixed(1)+'" y="'+(np.y+dy*14+3).toFixed(1)+'" font-size="10" fill="'+scolor(dimA[j].score)+'" text-anchor="middle" font-weight="600">'+dimA[j].score+'</text>';
      s+=node(np,MAIN,dimA[j].score,dimA[j].name,4);
      if(dimB){ var cp=P((dimB[j].score||0)/100,j,0,0); s+=node(cp,AUX,dimB[j].score,dimB[j].name,3); }
    }
    s+='</svg>';
    return s;
  }
};

/* ===================== #region L3 运行器 Runner（异步任务） ===================== */
APP.Runner = {
  running:false,
  run:function(stepId, taskName, fn, done){
    if(this.running) return;
    this.running=true;
    var step=APP.STEPS.find(function(s){return s.id===stepId;});
    APP.Steps.set(stepId, APP.ST.RUNNING);
    APP.Toast.show('正在执行「'+taskName+'」…','info');
    APP.render();
    setTimeout(function(){
      try{
        var result=fn();
        APP.Steps.set(stepId, APP.ST.REVIEW);
        APP.Toast.show('「'+taskName+'」执行完成，等待人工复核','ok');
        APP.render();
        if(done) done(result);
      }catch(e){
        APP.Toast.show('执行出错：'+e.message,'warn');
        APP.Steps.set(stepId, APP.ST.READY);
        APP.render();
      }
      APP.Runner.running=false;
    }, 350);
  },
  approve:function(stepId){
    APP.Steps.set(stepId, APP.ST.DONE);
    APP.Steps.unlockNext(stepId);
    APP.Toast.show('人工复核通过，进入下一步','ok');
    APP.render();
  }
};

/* ===================== #region L3.5 执行轨迹规划器 Rail ===================== */
APP.Rail = {
  statusOf:function(st){ return {locked:'idle',ready:'idle',running:'run',review_pending:'review',done:'done'}[st]||'idle'; },
  plan:function(){
    var cur=APP.state.meta.currentStep, ctx=APP.state.context, st, status, steps=[];
    var has=function(k){ return !!ctx[k]; };
    if(cur==='home'){ return {status:'idle',title:'待命',steps:[{s:0,t:'等待开始训练',d:'点击「开始本次训练」进入试讲采集',e:''}]}; }
    st=APP.Steps.get(cur).status; status=this.statusOf(st);
    var run=(st==='running'||st==='review_pending')?1:(st==='done'?2:0);
    var T=function(s,t,d,e){ steps.push({s:s,t:t,d:d||'',e:e||''}); };
    if(cur==='collect'){
      T(has('lesson')?2:run,'读取试讲输入', has('lesson')?('已录入试讲 · '+(ctx.lesson&&ctx.lesson.title||'')):'等待录入试讲');
    }else if(cur==='diagnose'){
      var d=ctx.diagnosis;
      var segN=(ctx.lesson&&ctx.lesson.parsed&&ctx.lesson.parsed.segments)?ctx.lesson.parsed.segments.length:0;
      T(run?2:run,'解析试讲转写','切分为 '+segN+' 个片段');
      T(d?2:(run?1:0),'提取行为特征', d?('识别 '+(d.dimensions?d.dimensions.length:0)+' 项能力维度'):'正在定位候答停顿与填充词');
      T(d?2:(run?1:0),'匹配评价标准','比对试讲行为诊断知识库');
    }else if(cur==='simulate'){
      /* Rail 感知 simulate.stage，避免「正在运行课堂事件」与「正在分析课堂」状态冲突（R11） */
      var s=ctx.sim, sg=s?(s.stage||'classroom'):'selecting';
      if(sg==='selecting'){
        T(0,'选择模拟学生','从 4 位虚拟学生中选择本轮训练对象');
      }else if(sg==='preparing'){
        T(1,'装载本轮训练目标','按诊断最弱维度装载课堂挑战');
      }else if(sg==='classroom'){
        T(2,'生成模拟学生', s.persona.name+' · 已互动 '+s.messages.length+' 条');
        T(s.pending?1:2,'课堂对话进行中', s.pending?'云端正在生成学生回应':'等待你的讲解或提问');
      }else if(sg==='analyzing'){
        T(2,'整理课堂记录','读取本轮 '+s.messages.length+' 条互动');
        T(1,'生成本轮建议','按课堂记录提炼最需改进的行为');
      }else{ /* advice */
        T(2,'整理课堂记录','已完成 · 本地分析');
        T(2,'生成本轮建议','已生成 '+((s.analysis&&s.analysis.items)?s.analysis.items.length:0)+' 条建议');
      }
    }else if(cur==='compare'){
      T(ctx.compare?2:run,'解析重讲','读取第二轮试讲转写');
      T(ctx.compare?2:run,'对比首讲指标','定位关键维度变化');
    }else if(cur==='archive'){
      T(ctx.archive?2:run,'沉淀训练记录','写入成长档案');
      T(ctx.archive?2:run,'生成下一轮建议','按最弱能力生成训练任务');
    }
    if(!steps.length) T(0,'待执行','完成上一步后自动推进');
    var step=APP.STEPS.filter(function(x){return x.id===cur;})[0];
    return {status:status,title:step?step.name:'',steps:steps};
  }
};

APP.View = {
  home:function(){
    var ctx=APP.state.context, lesson=ctx.lesson, diag=ctx.diagnosis;
    var started=!!(lesson||diag||ctx.archive);
    var ab={}; if(diag&&diag.dimensions){ diag.dimensions.forEach(function(x){ ab[x.name]={name:x.name, score:x.score}; }); }
    var names=Object.keys(ab), weak=null, weakName='', weakScore=0;
    names.forEach(function(n){ var v=ab[n]; var s=(v&&v.score!=null)?v.score:v; if(weak===null||s<weakScore){ weak=n; weakScore=s; weakName=(v&&v.name)||n; } });
    var done=0; APP.STEPS.forEach(function(s){ if(APP.Steps.get(s.id).status===APP.ST.DONE) done++; });
    var _pri0=diag&&diag.priority;
    var h='';
    /* 1. Hero：参考官网落地页——衬线大标题 + 引导语 + 唯一主按钮 + 渐变锚点 */
    h+='<div class="home-hero">';
    h+='<div class="home-hero-copy">';
    h+='<span class="eyebrow">青蓝试讲 · 教学技能训练</span>';

      h+='<div class="card"><div class="card-h"><h3>迷思概念明细</h3><span class="tag red">'+d.misconceptions.length+' 处</span></div>';
      d.misconceptions.forEach(function(m){
        h+='<details class="pc"><summary class="pc-top"><div class="pc-score" style="color:var(--c-red);font-size:16px">!</div><div class="pc-info"><div class="pc-name">'+APP.U.esc(m.term)+'</div><div class="pc-prob">引用：「'+APP.U.esc(m.quote)+'」</div></div><span class="pc-check" style="pointer-events:none"><span class="mk"></span>'+APP.U.fmtTime(m.t)+'</span></summary>';
        h+='<div class="pc-body"><div class="pc-sec"><div class="pc-lbl">正确表述</div><div class="pc-crit">'+APP.U.esc(m.correct)+'</div></div>';
        h+='<div class="pc-sec"><div class="pc-lbl">纠错动作</div><div class="pc-act">'+APP.U.esc(m.fix)+'</div></div></div></details>';
      });
      h+='</div>';
    }
    /* 5. 底部唯一主按钮 */
    if(st===APP.ST.REVIEW){
      h+=APP.C.taskActionBar({
        left:'综合 <b>'+d.avg+'</b> 分 · 已复核 <b>'+revCnt+'</b> / '+(problems?problems.length:d.dimensions.length),
        primary:{label:'进入 AI 学生模拟', onClick:"APP.act.approve('diagnose')"}
      });
    }
    return h;
  },
  /* ===== Step3 模拟课堂：A 选学生 / B 进入课堂 / C 课堂 / E 本地分析 / F 建议 ===== */
  simulate:function(){
    var sim=APP.state.context.sim;
    var stage = sim ? (sim.stage||'classroom') : 'selecting';
    if(stage==='preparing') return this._simPreparing();
    if(stage==='analyzing') return this._simAnalyzing();
    if(stage==='advice')    return this._simAdvice();
    if(stage==='classroom') return this._simClassroom();
    return this._simSelect();
  },

  /* 对话区 HTML：供增量更新复用，避免整页重绘导致输入框失焦（R7） */
  chatHTML:function(sim){
    var h='', n=sim.messages.length;
    sim.messages.forEach(function(m,i){
      var cls=m.who==='student'?'student':(m.who==='teacher'?'teacher':'sys');
      var flash=(sim.highlightIndex===i)?' flash':'';
      var enter=(i===n-1 && sim.highlightIndex!==i)?' enter':'';
      h+='<div class="msg '+cls+flash+enter+'">'+(m.who!=='sys'?'<span class="who">'+(m.who==='student'?APP.U.esc(sim.persona.name):'你（试讲者）')+'</span>':'')+APP.U.esc(m.text)+'</div>';
    });
    if(!sim.messages.length) h+='<div class="msg sys">课堂已开始。输入你的讲解或提问，'+APP.U.esc(sim.persona.name)+' 会按人设回应。</div>';

    return h;
  },
  renderChat:function(){
    var box=APP.U.el('chatBox'), sim=APP.state.context.sim;
    if(!box||!sim) return;
    box.innerHTML=this.chatHTML(sim);
    box.scrollTop=box.scrollHeight;
    if(sim.highlightIndex!=null){
      var f=box.querySelector('.msg.flash');
      if(f){ try{ box.scrollTop=Math.max(0, f.offsetTop-box.clientHeight/2); }catch(e){} }
    }
  },

  compare:function(){
    var ctx=APP.state.context;
    var h='<div class="page-head"><span class="eyebrow">'+APP.C.icon('reteach')+'Step 4 · 重讲对比</span><h1>首讲 vs 重讲</h1><p>同课题重讲，用绝对数值与时间证据验证改进是否真正发生。</p></div>';
    if(!ctx.diagnosis){ h+='<div class="card"><p class="muted">请先完成行为诊断。</p></div>'; return h; }
    if(!ctx.compare){
      /* 再讲一次入口：第一屏聚焦唯一训练点 + 首讲问题证据，完整细节折叠 */
      var _pri=ctx.diagnosis&&ctx.diagnosis.priority;
      var _focus=ctx.reteachFocus||(_pri?_pri.action:'针对性改进最弱能力');
      h+='<div class="reteach-focus"><div class="rf-eyebrow">'+APP.C.icon('spark')+' 这一次，只练一个点</div>';
      h+='<div class="rf-title">'+APP.U.esc(_focus)+'</div>';
      h+=(_pri?'<div class="rf-meta">'+APP.U.esc(_pri.dimensionName)+' · 当前 '+_pri.score+' 分 · 权重 '+_pri.weight+'%</div>':'');
      h+='</div>';
      if(_pri){
        h+='<div class="card"><div class="card-h"><h3>首讲问题证据</h3><span class="tag brand">'+APP.U.esc(_pri.dimensionName)+'</span></div>';
        if(_pri.evidence&&_pri.evidence.length){
          _pri.evidence.forEach(function(e){ h+='<div class="evidence"><span class="t">'+APP.U.esc(e.t)+'</span> '+APP.U.esc(e.txt)+'</div>'; });
        }else{
          h+='<p class="muted">该维度暂无可定位的时间证据，请聚焦整体课堂表现。</p>';
        }
        h+='<div class="action">'+APP.C.icon('spark')+' '+APP.U.esc(_pri.action)+'</div>';
        h+='</div>';
      }
      h+=APP.C.taskActionBar({
        left:_pri?('首讲综合 '+ctx.diagnosis.avg+' 分 · 本轮聚焦「'+APP.U.esc(_pri.dimensionName)+'」'):'重讲同课题，验证改进是否真正发生',
        primary:{label:'载入"改进后"样例', onClick:"APP.act.loadReteach()"}
      });
      h+='<details class="card other-methods"><summary>'+APP.C.icon('doc')+' 完整首讲诊断 / 手动粘贴重讲</summary><div class="other-body">';
      if(ctx.diagnosis&&ctx.diagnosis.dimensions){
        h+='<div class="sub">首讲五项能力</div>';
        ctx.diagnosis.dimensions.forEach(function(d){ h+='<div class="dim"><div class="dim-h"><span class="dim-name">'+APP.U.esc(d.name)+'</span><span class="score">'+d.score+'</span></div></div>'; });
      }
      h+='<div class="sub" style="margin:14px 0 8px">手动粘贴你的重讲转写稿</div>';
      h+='<textarea id="reteachInput" class="mono" rows="10" placeholder="粘贴你的重讲转写稿……"></textarea>';
      h+='<div style="margin-top:10px"><button class="btn secondary" onclick="APP.act.parseReteach()">解析重讲并生成对比</button></div>';
      h+='</div></details>';
      return h;
    }
    var c=ctx.compare;
    var st=APP.Steps.get('compare').status;
    function mini(d){ return '<details class="cmp-mini"><summary>过程指标</summary><div class="m-grid">'
      +'<div class="m"><div class="n">'+d.meta.speed+'</div><div class="l">语速</div></div>'
      +'<div class="m"><div class="n">'+d.meta.fillerCount+'</div><div class="l">填充词</div></div>'
      +'<div class="m"><div class="n">'+d.meta.questionCount+'</div><div class="l">提问</div></div>'
      +'<div class="m"><div class="n">'+d.meta.waitIssueCount+'</div><div class="l">候答不足</div></div>'
      +'</div></details>'; }
    /* 0. 本轮训练目标达成（同一指标前后对比） */
    var _f=c.before&&c.before.priority;
    var _fdimId=_f?_f.dimensionId:null;
    if(_f){
      var _fa=c.after&&c.after.dimensions?(c.after.dimensions.filter(function(x){return x.id===_f.dimensionId;})[0]||null):null;
      var _faScore=_fa?_fa.score:_f.score;
      var _fd=_faScore-_f.score;
      var _fdone=_faScore>=80;
      h+='<div class="card" style="border-left:4px solid '+( _fdone?'var(--c-ok)':'var(--c-brand)')+'">'
        +'<div class="card-h"><h3>'+APP.C.icon('spark')+' 本轮训练目标达成</h3><span class="sub">同一指标 · '+APP.U.esc(_f.dimensionName)+'</span></div>'
        +'<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
        +'<div style="font-size:14px;color:var(--c-text-2)">目标：'+APP.U.esc(_f.action)+'</div>'
        +'<div style="font-size:22px;font-weight:700">'+_f.score+' <span style="color:var(--c-text-3);font-size:14px">→</span> '+_faScore+' 分 <span style="font-size:14px;font-weight:600;color:'+(_fd>=0?'var(--c-ok)':'var(--c-red)')+'">'+( _fd>0?'+':'')+_fd+'</span></div>'
        +'<span class="tag '+( _fdone?'ok':'amber')+'">'+( _fdone?'已达成（≥80）':'继续巩固')+'</span>'
        +'</div>'
        +'<div style="font-size:12.5px;color:var(--c-text-2);margin-top:6px">'+APP.U.esc(_f.why)+'</div>'
        +'</div>';
    }
    /* 1. 并排对比卡（标注首讲/重讲各自的诊断来源，避免把本地分析冒充云端） */
    var _srcTag=function(d){ return d.source==='cloud'
      ? '<div class="sub" style="margin:4px 0 6px"><span class="tag ok">云端分析</span></div>'
      : '<div class="sub" style="margin:4px 0 6px"><span class="tag amber">本地规则分析</span></div>'; };
    h+='<div class="cmp-grid">';
    h+='<div class="cmp-side"><h3>'+APP.C.icon('doc')+' 首讲</h3>'+_srcTag(c.before)+'<div class="avg">'+c.before.avg+'<small> 分</small></div>'+mini(c.before)+'</div>';
    h+='<div class="cmp-side"><h3>'+APP.C.icon('spark')+' 重讲</h3>'+_srcTag(c.after)+'<div class="avg">'+c.after.avg+'<small> 分</small></div>'+mini(c.after)+'</div>';
    h+='</div>';
    /* 2. 雷达对比 / 指标明细（Tab 化） */
    var gains=0, regress=0;
    var dimsOrdered=c.before.dimensions.slice();
    if(_fdimId){ dimsOrdered.sort(function(a,b){ if(a.id===_fdimId)return -1; if(b.id===_fdimId)return 1; return 0; }); }
    h+='<div class="card"><div class="card-h"><h3>对比分析</h3>'+APP.View.badge(st)+'</div>';
    h+='<div class="seg seg-tabs" style="margin-bottom:12px">'

/* ===================== #region 3D 人设卡 CoverFlow（PersonaCarousel） ===================== */
/* 独立视图交互层：负责焦点/旋转/翻转/选中状态与 transform 计算。
   轻量更新：旋转/翻转只改卡片 transform + 指示点 + 操作条，不整页 render（避免 .page 淡入卡顿）。 */
APP.PersonaCarousel = (function(){
  var N=0, personas=[], focus=0, flippedId=null;
  var stage=null, carousel=null, cards=[], dots=[];
  var dragX=0, dragActive=false, suppressClick=false;

  function draftId(){ var d=APP.state&&APP.state.context&&APP.state.context.simDraft; return (d&&d.personaId)||''; }
  function idxOf(pid){ for(var i=0;i<personas.length;i++){ if(personas[i].id===pid) return i; } return -1; }
  function offset(i){ var d=((i-focus)+N)%N; if(d>N/2) d-=N; return d; }

  function layout(){
    if(!carousel||!cards.length) return;
    var w=(cards[0]&&cards[0].offsetWidth)||260;
    var spread=Math.round(w*0.52), depth=Math.round(w*0.42);
    for(var i=0;i<cards.length;i++){
      var d=offset(i), a=Math.abs(d);
      var tx=Math.round(d*spread), ry=Math.round(d*-34), tz=Math.round(-a*depth);
      var sc=(1-a*0.14).toFixed(3), op=(1-a*0.22).toFixed(3), bl=(a*0.8).toFixed(2);
      cards[i].style.transform='translate(-50%,-50%) translateX('+tx+'px) rotateY('+ry+'deg) translateZ('+tz+'px) scale('+sc+')';
      cards[i].style.opacity=op;
      cards[i].style.filter=(a>0)?('blur('+bl+'px)'):'none';
      cards[i].style.zIndex=String(10-a);
      cards[i].classList.toggle('is-focus', i===focus);
      cards[i].classList.toggle('is-selected', personas[i].id===draftId());
      cards[i].classList.toggle('is-flipped', personas[i].id===flippedId);
    }
    for(var j=0;j<dots.length;j++){ dots[j].classList.toggle('on', j===focus); }
  }

  function select(pid){ APP.state.context.simDraft={personaId:pid}; APP.Store.save(APP.state); }

  function syncBar(){
    var bar=document.querySelector('#view .task-action-bar');
    if(!bar) return;
    var pid=draftId();
    var dp=personas.filter(function(x){return x.id===pid;})[0];
    var left=bar.querySelector('.tab-left'), btn=bar.querySelector('.btn-lg');
    if(pid&&dp){
      if(left) left.innerHTML='已选择：'+APP.U.esc(dp.name);
      if(btn){ btn.disabled=false; btn.setAttribute('onclick','APP.act.beginSim()'); }
    }else{
      if(left) left.innerHTML='选择一位 AI 学生后即可开始模拟';
      if(btn){ btn.disabled=true; btn.setAttribute('onclick',''); }
    }
  }

  function go(dir){
    if(!N) return;
    focus=(focus+dir+N)%N;
    flippedId=null;
    select(personas[focus].id);
    layout(); syncBar();
  }
  function goTo(i){
    if(i<0||i>=N) return;
    focus=i; flippedId=null;
    select(personas[i].id);
    layout(); syncBar();
  }
  function cardClick(pid, idx){
    if(suppressClick){ suppressClick=false; return; }
    if(idx===focus){
      if(draftId()){ toggleFlip(pid); }
      else{ focus=idx; select(pid); layout(); syncBar(); }
    }else{
      focus=idx; flippedId=null; select(pid); layout(); syncBar();
    }
  }
  function toggleFlip(pid){ flippedId=(flippedId===pid)?null:pid; layout(); }

  function bindEvents(){
    if(!stage||stage._pcarBound) return;
    stage._pcarBound=true;
    stage.addEventListener('keydown', function(e){
      if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); go(1); }
    });
    stage.addEventListener('pointerdown', function(e){ dragActive=true; dragX=e.clientX; suppressClick=false; });
    stage.addEventListener('pointermove', function(){ /* 仅占位，保留拖拽判定于 pointerup */ });
    stage.addEventListener('pointerup', function(e){
      if(!dragActive) return; dragActive=false;
      var dx=e.clientX-dragX;
      if(Math.abs(dx)>50){ suppressClick=true; go(dx<0?1:-1); }
    });
    stage.addEventListener('pointercancel', function(){ dragActive=false; });
    stage.addEventListener('pointerleave', function(){ dragActive=false; });
  }

  function sync(){
    if(typeof document==='undefined') return;
    personas=APP.KB.studentPersonas||[];
    N=personas.length;
    stage=document.getElementById('personaStage');
    carousel=document.getElementById('personaCarousel');
    if(!stage||!carousel) return;
    cards=Array.prototype.slice.call(carousel.querySelectorAll('.persona-card'));
    dots=Array.prototype.slice.call(document.querySelectorAll('#pcarDots .pcar-dot'));
    var pid=draftId();
    focus=pid?Math.max(0, idxOf(pid)):0;
    flippedId=null;
    layout(); bindEvents();
  }

  return { sync:sync, go:go, goTo:goTo, cardClick:cardClick, toggleFlip:toggleFlip };
})();

/* ===================== 云服务配置（Cloudflare Worker 代理） ===================== */
/* Worker 地址：保护真实 API 密钥不暴露到前端 HTML。
 *   /api/asr     → 腾讯云录音文件识别（CreateRecTask + DescribeTaskStatus）
 *   /api/analyze → DeepSeek LLM 智能体诊断（OpenAI 兼容协议）
 * 各通道失败时均自动降级回离线引擎，保证演示不中断。
 */
APP.CLOUD = {
  workerUrl: 'https://shrill-fire-40ca.2478841433.workers.dev',
  asrTimeoutMs: 120000  /* 录音文件识别最长等待 2 分钟 */
};

/* ===================== #region L4.5 录制与语音转写适配层 ===================== */
/* 可插拔语音转写（ASR）适配层：
 *   APP.ASR.register(name, provider) 注册实现；provider(opts) 返回 {start,stop,abort}
 *   opts 回调：onFinal(text,ms) / onInterim(text) / onError(msg) / onEnd()
 *   默认 Provider = 浏览器 Web Speech（Chrome 开箱即用、免 key，实时）。
 *   云 ASR（腾讯云/讯飞/阿里等）可在外部注入：
 *     APP.ASR.register('cloud', function(opts){ // 上传音频 + 拉取转写
 */
APP.ASR = {
  providers:{},
  defaultProvider:'web-speech',
  register:function(name, provider){ this.providers[name]=provider; return this; },
  has:function(name){ return !!this.providers[name]; },
  available:function(){
    if(typeof window==='undefined') return false;
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    return !!SR;
  },
  /* 依据 opts.provider 或默认 provider 启动识别，返回句柄；失败时回调 onError 并返回 null */
  start:function(opts){
    opts=opts||{};
    var name=opts.provider||this.defaultProvider;
    var p=this.providers[name];
    if(!p){ if(opts.onError) opts.onError('未注册 ASR Provider：'+name); return null; }
    try{ return p(opts); }
    catch(e){ if(opts.onError) opts.onError((e&&e.message)||String(e)); return null; }
  },
  /* 文件式转写：上传音频 Blob，回调 done({text, durationSec} | {error})。云端 provider 用此通道。 */
  transcribe:function(blob, opts, done){
    opts=opts||{};
    var name=opts.provider||'cloud';
    var p=this.providers[name];
    if(!p || typeof p.transcribe!=='function'){ if(done) done({error:'未注册可转写文件的 ASR Provider：'+name}); return; }
    try{ return p.transcribe(blob, opts, done); }
    catch(e){ if(done) done({error:(e&&e.message)||String(e)}); }
  }
};

/* 默认 ASR Provider：Web Speech（实时识别，产出时间戳片段） */
APP.ASR.register('web-speech', function(opts){
  var w=window, SR=w.SpeechRecognition||w.webkitSpeechRecognition;
  if(!SR){ throw new Error('当前浏览器不支持语音识别（Web Speech）'); }
  var rec=new SR();
  rec.lang=opts.lang||'zh-CN';
  rec.continuous=true;
  rec.interimResults=true;
  var startedAt=Date.now();
  rec.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i], txt=(r[0]&&r[0].transcript)||'';
      if(r.isFinal){ if(opts.onFinal) opts.onFinal(txt, Date.now()-startedAt); }
      else { interim+=txt; }
    }
    if(opts.onInterim) opts.onInterim(interim);
  };
  rec.onerror=function(e){ if(opts.onError) opts.onError((e&&e.error)||'语音识别错误'); };
  rec.onend=function(){ if(opts.onEnd) opts.onEnd(); };
  return {
    start:function(){ try{ rec.start(); }catch(e){ if(opts.onError) opts.onError('无法启动语音识别'); } },
    stop:function(){ try{ rec.stop(); }catch(e){} },
    abort:function(){ try{ rec.abort(); }catch(e){} }
  };
});

/* 云 ASR Provider：腾讯云录音文件识别（通过 Cloudflare Worker 代理）
 *   transcribe(blob) 上传 WAV → 轮询任务 → 返回带 [MM:SS] 的转写文本
 *   依赖 APP.WavRecorder 产出的 16kHz/16bit/单声道 WAV。
 */
APP.ASR.register('cloud', {
  transcribe:function(blob, opts, done){
    var form=new FormData();
    form.append('file', blob, 'rec.wav');
    fetch(APP.CLOUD.workerUrl+'/api/asr', { method:'POST', body:form })
      .then(function(r){ return r.ok? r.json() : Promise.reject(new Error('ASR HTTP '+r.status)); })
      .then(function(d){
        if(d && d.error){ return done({error:d.error}); }
        if(d && typeof d.transcript==='string'){
          done({ text:d.transcript, durationSec:d.durationSec||0 });
        } else {
          done({error:'ASR 返回格式异常'});
        }
      })
      .catch(function(e){ if(done) done({error:(e&&e.message)||'ASR 请求失败'}); });
  }
});

/* WAV 录音器：直接产出 16kHz/16bit/单声道 PCM-WAV Blob（腾讯云 ASR 所需格式）
 *   浏览器原生 MediaRecorder 只能产出 webm，腾讯云 ASR 不支持，故自实现。
 */
APP.WavRecorder = {
  state:'idle',          /* idle | starting | recording | stopping */
  audioCtx:null, stream:null, proc:null, frames:[], startedAt:0,
  supported:function(){
    if(typeof window==='undefined'||typeof navigator==='undefined') return false;
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
      (window.AudioContext||window.webkitAudioContext));
  },
  secure:function(){ return !!(typeof window!=='undefined' && window.isSecureContext); },
  start:function(opts){
    var self=this; opts=opts||{};
    if(this.state!=='idle') return;
    this.state='starting'; this.frames=[];
    navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, sampleRate:16000, echoCancellation:true, noiseSuppression:true
    }}).then(function(stream){
      self.stream=stream;
      var AC=window.AudioContext||window.webkitAudioContext;
      self.audioCtx=new AC({sampleRate:16000});
      var src=self.audioCtx.createMediaStreamSource(stream);
      /* ScriptProcessor 4096 帧缓冲，单声道 */
      self.proc=self.audioCtx.createScriptProcessor(4096,1,1);
      self.proc.onaudioprocess=function(e){
        var inp=e.inputBuffer.getChannelData(0);
        var buf=new Float32Array(inp.length); buf.set(inp);
        self.frames.push(buf);
        if(opts.onTick) opts.onTick(Math.round((Date.now()-self.startedAt)/1000));
      };
      src.connect(self.proc); self.proc.connect(self.audioCtx.destination);
      self.startedAt=Date.now();
      self.state='recording';
      if(opts.onStart) opts.onStart();
    }).catch(function(e){
      self.state='idle';
      var msg=(e&&e.name==='NotAllowedError')?'麦克风权限被拒绝，请在浏览器中允许后重试'
        :(e&&e.name==='NotFoundError')?'未检测到麦克风设备'
        :((e&&e.message)||'无法访问麦克风');
      if(opts.onError) opts.onError(msg);
    });
  },
  stop:function(done){
    var self=this;
    if(this.state!=='recording'){ if(done) done(null); return; }
    this.state='stopping';
    try{ if(this.proc) this.proc.disconnect(); }catch(e){}
    try{ if(this.stream) this.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    var blob=this.encodeWav(this.frames, 16000);
    try{ if(this.audioCtx) this.audioCtx.close(); }catch(e){}
    this.audioCtx=null; this.proc=null; this.stream=null; this.frames=[]; this.state='idle';
    if(done) done(blob);
  },
  cancel:function(){
    try{ if(this.proc) this.proc.disconnect(); }catch(e){}
    try{ if(this.stream) this.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ if(this.audioCtx) this.audioCtx.close(); }catch(e){}
    this.audioCtx=null; this.proc=null; this.stream=null; this.frames=[]; this.state='idle';
  },
  /* 把 32位浮点 PCM 帧序列编码为 WAV Blob */
  encodeWav:function(frames, sampleRate){
    var total=0; frames.forEach(function(f){ total+=f.length; });
    if(!total) return new Blob([],{type:'audio/wav'});
    var buf=new ArrayBuffer(44 + total*2);
    var view=new DataView(buf);
    var writeStr=function(off,s){ for(var i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); };
    writeStr(0,'RIFF'); view.setUint32(4, 36+total*2, true);
    writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true);
    view.setUint16(20,1,true); view.setUint16(22,1,true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate*2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36,'data'); view.setUint32(40, total*2, true);
    var off=44;
    for(var fi=0; fi<frames.length; fi++){
      var f=frames[fi];
      for(var i=0;i<f.length;i++){
        var s=Math.max(-1, Math.min(1, f[i]));
        view.setInt16(off, s<0? s*0x8000 : s*0x7FFF, true);
        off+=2;
      }
    }
    return new Blob([buf], {type:'audio/wav'});
  }
};

/* 麦克风录制（getUserMedia + MediaRecorder），与 ASR 联动产出带时间戳转写稿 */
APP.Recorder = {
  state:'idle',            /* idle | starting | recording | stopping */
  asrHandle:null, liveText:'', finalSegs:[],
  wavBlob:null, startedAt:0, timer:null,
  supported:function(){ return APP.WavRecorder.supported(); },
  secure:function(){ return APP.WavRecorder.secure(); },
  start:function(opts){
    var self=this; opts=opts||{};
    if(this.state!=='idle') return;
    this.state='starting';
    this.finalSegs=[]; this.liveText=''; this.wavBlob=null;
    APP.WavRecorder.start({
      onStart:function(){
        self.startedAt=APP.WavRecorder.startedAt;
        self.state='recording';
        self.timer=setInterval(function(){
          if(opts.onTick) opts.onTick(Math.round((Date.now()-self.startedAt)/1000), self.liveText);
        },500);
        /* 同时启动 Web Speech 实时显示（如可用），仅用于 interim 提示；最终转写以云端为主 */
        self.asrHandle=APP.ASR.start({
          onFinal:function(txt,ms){ self.finalSegs.push({ms:ms,text:txt}); },
          onInterim:function(txt){ self.liveText=txt; if(opts.onInterim) opts.onInterim(txt); },
          onError:function(){ /* 实时转写失败不影响云端转写 */ },
          onEnd:function(){}
        });
        if(self.asrHandle){ try{ self.asrHandle.start(); }catch(e){ self.asrHandle=null; } }
        if(opts.onStart) opts.onStart();
      },
      onError:function(msg){ self.state='idle'; if(opts.onError) opts.onError(msg); }
    });
  },
  stop:function(){
    if(this.state!=='recording') return;
    this.state='stopping';
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.asrHandle){ try{ this.asrHandle.stop(); }catch(e){} this.asrHandle=null; }
    var self=this;
    APP.WavRecorder.stop(function(blob){ self.wavBlob=blob; self.state='idle'; });
  },
  cancel:function(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.asrHandle){ try{ this.asrHandle.abort(); }catch(e){} this.asrHandle=null; }
    APP.WavRecorder.cancel();
    this.wavBlob=null; this.finalSegs=[]; this.liveText=''; this.state='idle';
  },
  stopTracks:function(){ /* WavRecorder 内部已管理 tracks，保留空方法兼容旧调用 */ },
  /* 将识别到的 finalSegs 转成带 [MM:SS] 的转写稿文本（云端转写失败时的降级数据源） */
  buildTranscript:function(){
    var segs=this.finalSegs.slice();
    if(!segs.length) return { text:'', durationSec:0, segments:[], wavBlob:this.wavBlob };
    var lines=segs.map(function(s){ var sec=Math.max(0,Math.floor(s.ms/1000)); return '['+APP.U.fmtTime(sec)+'] '+s.text; });
    return { text:lines.join('\n'), durationSec:Math.max(1,Math.round(segs[segs.length-1].ms/1000)), segments:segs, wavBlob:this.wavBlob };
  }
};

/* 离线智能体建议：基于诊断结论生成下一步训练建议 */
function offlineAdvise(ctx){
  var d=ctx&&ctx.diagnosis;
  if(!d) return { text:'完成首次诊断后，将给出下一步训练建议。', items:[] };
  var items=[];
  (d.topActions||[]).slice(0,3).forEach(function(a){ items.push({type:'action', text:a}); });
  (d.misconceptions||[]).slice(0,2).forEach(function(m){ items.push({type:'concept', text:'纠正迷思概念「'+m.term+'」：'+((m.fix&&m.fix)||m.correct||'')}); });
  var weak=(d.dimensions||[]).slice().sort(function(a,b){return a.score-b.score;})[0];
  if(weak) items.push({type:'focus', text:'重点训练能力：'+weak.name});
  return { text:'针对最弱能力「'+(weak?weak.name:'—')+'」进行针对性训练，并在模拟课堂中验证改进。', items:items };
}

/* 可插拔智能体（Agent）适配层：
 *   APP.AgentProvider.register(name, provider) 注册智能体实现
 *   provider 可实现 analyze(parsed, opts, done) 与 advise(ctx, opts, done)
 *   默认 active='offline'：analyze 回退 APP.Engine.diagnose，advise 回退离线建议
 *   接入真实 LLM/Agent API 时：register 云 provider 后 APP.AgentProvider.setActive('cloud')
 *   调用失败时自动降级回离线引擎，保证演示不中断。
 */
APP.AgentProvider = {
  providers:{},
  active:'offline',
  register:function(name, provider){ this.providers[name]=provider; return this; },
  setActive:function(name){ if(this.providers[name]) this.active=name; return this; },
  describe:function(){ return (this.providers[this.active]&&this.providers[this.active].label)||'离线诊断引擎'; },
  analyze:function(parsed, opts, done){
    var p=this.providers[this.active];
    if(p && p.analyze){
      try{ return p.analyze(parsed, opts, done); }
      catch(e){ /* 降级回离线引擎 */ }
    }
    var r=APP.Engine.diagnose(parsed);
    if(done) done(r,'local'); return r;
  },
  advise:function(ctx, opts, done){
    var p=this.providers[this.active];
    if(p && p.advise){
      try{ return p.advise(ctx, opts, done); }
      catch(e){ /* 降级回离线建议 */ }
    }
    var r=offlineAdvise(ctx);
    if(done) done(r); return r;
  }
};

/* 默认离线智能体：直接复用现有离线诊断引擎 */
APP.AgentProvider.register('offline', {

  advise:function(ctx, opts, done){ var r=offlineAdvise(ctx); if(done) done(r); return r; }
});

/* ===== 诊断自检（仅开发调试：日志只进 console，不污染用户界面） =====
 * validateDiagnosis：校验云端返回是否为与 Engine.diagnose 同构的 5 维诊断。
 * checkCloud：用样例转写对 /api/analyze 做真实探活，报告 endpoint/HTTP/schema/最终来源。
 */
APP.Diagnostics = {
  EXPECTED_DIMS: ['rub_d01','rub_d02','rub_d03','rub_d04','rub_d05'],
  EXPECTED_WEIGHTS: [20,22,28,18,12],
  validateDiagnosis:function(d){
    if(!d || typeof d!=='object') return { ok:false, reason:'非对象' };
    var dims=d.dimensions;
    if(!Array.isArray(dims) || dims.length!==5) return { ok:false, reason:'dimensions 数量不是 5（当前 '+(Array.isArray(dims)?dims.length:typeof dims)+'）' };
    for(var i=0;i<5;i++){
      var x=dims[i];
      if(!x || x.id!==this.EXPECTED_DIMS[i]) return { ok:false, reason:'第 '+(i+1)+' 维 id 期望 '+this.EXPECTED_DIMS[i]+'，实际 '+((x&&x.id)||'undefined') };
      var s=Number(x.score);
      if(!(s>=0 && s<=100)) return { ok:false, reason:'第 '+(i+1)+' 维 score 非法：'+x.score };
      if(Number(x.weight)!==this.EXPECTED_WEIGHTS[i]) return { ok:false, reason:'第 '+(i+1)+' 维 weight 期望 '+this.EXPECTED_WEIGHTS[i]+'，实际 '+x.weight };
    }
    if(!(Number(d.avg)>=0 && Number(d.avg)<=100)) return { ok:false, reason:'avg 非法：'+d.avg };
    if(!d.priority || !d.priority.dimensionId) return { ok:false, reason:'priority 缺失' };
    if(typeof d.grade!=='string') return { ok:false, reason:'grade 缺失' };
    if(!d.gradeBand || d.gradeBand.level!==d.grade) return { ok:false, reason:'gradeBand 与 grade 不一致' };
    return { ok:true, reason:'schema OK' };
  },
  checkCloud:function(){
    var self=this;
    var workerUrl=APP.CLOUD.workerUrl;
    var raw=(APP.KB.sampleLesson&&APP.KB.sampleLesson.transcriptBefore)||'';
    console.log('[Diagnostics.checkCloud] endpoint='+workerUrl+'/api/analyze');
    console.log('[Diagnostics.checkCloud] mode='+(APP.Settings.isOnline()?'online':'offline')+' active='+APP.AgentProvider.active);
    return fetch(workerUrl+'/api/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ transcript: raw, subject:'物理', grade:'' })
    }).then(function(r){
      console.log('[Diagnostics.checkCloud] HTTP '+r.status);
      return r.json().then(function(d){ return { status:r.status, ok:r.ok, body:d }; }).catch(function(){ return { status:r.status, ok:r.ok, body:null }; });
    }).then(function(res){
      var v=self.validateDiagnosis(res.body);
      console.log('[Diagnostics.checkCloud] schema='+v.reason);
      console.log('[Diagnostics.checkCloud] finalSource='+(v.ok?'cloud':'local(fallback)'));
      return { endpoint:workerUrl+'/api/analyze', http:res.status, schemaOk:v.ok, reason:v.reason };
    }).catch(function(e){
      console.log('[Diagnostics.checkCloud] 请求失败：'+((e&&e.message)||e));
      console.log('[Diagnostics.checkCloud] finalSource=local(fallback)');
      return { endpoint:workerUrl+'/api/analyze', http:0, schemaOk:false, reason:String((e&&e.message)||e) };
    });
  }
};

/* 云端智能体：通过 Cloudflare Worker 代理调用 DeepSeek LLM
 *   POST /api/analyze {transcript, subject, grade} → 5 维 diagnosis（与 Engine.diagnose 同构）
 *   5 维 schema 校验通过才采纳为 cloud；否则自动降级回 APP.Engine.diagnose（source=local）。
 */
APP.AgentProvider.register('cloud', {
  label:'DeepSeek 云端诊断',
  analyze:function(parsed, opts, done){
    var fallback=function(){ var r=APP.Engine.diagnose(parsed); if(done) done(r,'local'); return r; };
    try{
      fetch(APP.CLOUD.workerUrl+'/api/analyze', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          transcript: (parsed&&parsed.raw)||'',
          subject: (opts&&opts.subject)||'物理',
          grade: (opts&&opts.grade)||''
        })
      }).then(function(r){ return r.ok? r.json() : Promise.reject(new Error('HTTP '+r.status)); })
        .then(function(d){
          /* 5 维 schema 校验：不通过则回退本地，杜绝「在线成功却渲染 8 轴/undefined」 */
          var v=APP.Diagnostics.validateDiagnosis(d);
          if(v.ok){ if(done) done(d,'cloud'); return d; }
          else { console.log('[AgentProvider.cloud] schema 校验失败，回退本地：'+v.reason); return fallback(); }
        })
        .catch(function(){ return fallback(); });
    }catch(e){ return fallback(); }
  },
  advise:function(ctx, opts, done){ var r=offlineAdvise(ctx); if(done) done(r); return r; }
});

APP.Drawers = {
  CFG: {
    navDrawer: { trigger:'navToggle', focus:'navDrawerClose' },
    drawer:    { trigger:'gearBtn',   focus:'drawerClose' }
  },
  _mask:function(){ return document.getElementById('drawerMask'); },
  isOpen:function(id){ var d=document.getElementById(id); return !!(d&&d.classList.contains('open')); },
  open:function(id){
    var d=document.getElementById(id); if(!d) return this;
    /* 互斥：一次只开一个抽屉 */
    var other=(id==='navDrawer')?'drawer':'navDrawer';
    var od=document.getElementById(other); if(od) od.classList.remove('open');
    d.classList.add('open');
    var m=this._mask(); if(m) m.classList.add('open');
    var c=this.CFG[id]; var el=c?(document.getElementById(c.focus)||d.querySelector('.drawer-close')):d.querySelector('.drawer-close');
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} } }
    return this;
  },
  close:function(id){
    var d=document.getElementById(id); if(!d) return this;
    var wasOpen=d.classList.contains('open');
    d.classList.remove('open');
    if(!wasOpen) return this;
    var m=this._mask(); if(m) m.classList.remove('open');
    var c=this.CFG[id]; var el=c?(document.getElementById(c.trigger)||null):null;
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} } }
    return this;
  },
  toggle:function(id){
    if(this.isOpen(id)){ this.close(id); } else { this.open(id); }
    return this;
  },

      if(!parsed.segments.length){ APP.Toast.show('文件中未识别到有效转写内容','warn'); return; }
      var title=f.name.replace(/\.[^.]+$/,'')||'上传试讲';
      parsed.raw=t;
      APP.state.context.reviewed={};
      APP.state.context.lesson={ title:title, subject:'物理', grade:'', raw:t, parsed:parsed, source:'upload' };
      /* 立即用离线诊断渲染，避免界面空白 */
      APP.state.context.diagnosis=APP.Engine.diagnose(parsed);
      APP.state.context.diagnosis.title=title;
      APP.Steps.set('collect',APP.ST.DONE);
      APP.Steps.set('diagnose',APP.ST.REVIEW);
      APP.state.meta.currentStep='collect';
      APP.Store.save(APP.state); APP.render();
      APP.act.guideToDiagnose();
      if(APP.Settings.isOnline()){
        APP.Toast.show('已上传转写稿，正在云端诊断…','ok');
        /* 云端 LLM 异步覆盖诊断结果（失败自动降级，来源写入 d.source） */
        APP.AgentProvider.analyze(parsed, {subject:'物理'}, function(d, src){
          d.title=title;
          d.source=src||'local';
          APP.state.context.diagnosis=d;
          APP.Store.save(APP.state); APP.render();
          APP.Toast.show(src==='cloud'?'云端诊断完成':'云端不可用，已使用本地诊断', src==='cloud'?'ok':'warn');
        });

        APP.Toast.show('已上传转写稿，离线诊断完成','ok');
