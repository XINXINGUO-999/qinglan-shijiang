<style>
:root{

  --c-brand:#2C7A9D; --c-brand-deep:#1F6B94; --c-brand-bright:#3B8FB4; --c-brand-soft:#EAF2F8; --c-ink:#16324B;
  --c-teal:#2E8B80; --c-teal-soft:#E4F1EE;
  --c-amber:#C77A2E; --c-amber-soft:#F7EDDE; --c-coral:#B4562A; --c-coral-soft:#F9EAE2;
  --c-purple:#5A5BA6; --c-purple-soft:#ECECF7; --c-red:#C0392B; --c-red-soft:#F9E6E4;

  --c-border:#E4EBF1; --c-ok:#2E8B80; --c-warn:#C77A2E;
  --radius:12px; --radius-lg:16px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
  --lh-tight:1.25; --lh-body:1.65;
  --shadow-sm:0 1px 2px rgba(22,50,75,.04);
  --shadow:0 1px 2px rgba(22,50,75,.05),0 4px 14px rgba(22,50,75,.06);
  --shadow-lg:0 8px 30px rgba(22,50,75,.14);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-mono:"SF Mono","JetBrains Mono",Consolas,Menlo,monospace;
  /* ===== 字体系统（ROUND 4：正文无衬线、大标题典雅衬线、数据/时间用 mono） ===== */
  --font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --fs-h1:28px; --fs-h2:21px;
  /* ===== 2.5D 雷达几何参数（ROUND 4，通过 CSS 变量控制挤出厚度/背板偏移/网格透明度） ===== */
  --rd-depth-x:7px; --rd-depth-y:7px; --rd-back-offset:11px; --rd-grid-opacity:.5;
  /* ===== 品牌语义 token（ROUND 1） ===== */
  --brand-primary:#2C7A9D; --brand-deep:#1F6B94; --brand-soft:#EAF2F8;
  --ink:#16324B; --paper:#ffffff; --border:#E4EBF1;
  --success:#2E8B80; --warning:#C77A2E;
  --motion-fast:140ms; --motion-normal:210ms; --motion-slow:360ms;
  /* ===== 品牌渐变色块（ROUND 3，沿用蓝/青体系，仅用于抽屉品牌带、首页主视觉锚点与极少数 hover） ===== */
  --brand-accent-1:#3B8FB4; --brand-accent-2:#2C7A9D; --brand-accent-3:#2E8B80;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--c-bg); color:var(--c-text-1); font-size:var(--fs-md); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
}
/* 大标题 / 品牌标题：典雅衬线；正文与按钮保持无衬线 */
.page-head h1,.home-hero h1,.rf-title,.brand .logo-wordmark,.db-t{font-family:var(--font-serif);letter-spacing:.4px}
.app{max-width:1040px;margin:0 auto;padding:20px 20px 60px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.brand{--logo-size:40px;display:flex;align-items:center;gap:11px}

.brand.lg{--logo-size:48px}
.logo-mark{width:var(--logo-size);height:var(--logo-size);flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;overflow:hidden;box-shadow:0 2px 7px rgba(31,107,148,.20),inset 0 1px 0 rgba(255,255,255,.16)}
.logo-mark svg{width:100%;height:100%;display:block}
.logo-wordmark{font-size:calc(var(--logo-size)*.46);font-weight:700;color:var(--ink);letter-spacing:.4px;line-height:1.1}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:500;padding:3px 10px;border-radius:999px;background:var(--c-surface-2);color:var(--c-text-2)}
.tag.brand{background:var(--c-brand-soft);color:var(--c-brand)}
.tag.teal{background:var(--c-teal-soft);color:var(--c-teal)}
.tag.amber{background:var(--c-amber-soft);color:var(--c-amber)}
.tag.coral{background:var(--c-coral-soft);color:var(--c-coral)}
.tag.purple{background:var(--c-purple-soft);color:var(--c-purple)}
.tag.red{background:var(--c-red-soft);color:var(--c-red)}

.tag.warn{background:var(--c-amber-soft);color:var(--c-warn)}
.nav{display:flex;gap:8px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:8px;margin-bottom:18px;overflow-x:auto}
.nav-item{flex:1;min-width:130px;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:var(--motion-fast) var(--ease);background:transparent}
.nav-item:hover{background:var(--c-surface-2)}
.nav-item.active{background:var(--c-brand-soft)}
.nav-item.locked{opacity:.45;cursor:not-allowed}
.nav-item.done .nv-i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--c-teal-soft);color:var(--c-ok);font-size:10px;line-height:1;flex:none}
.nv-k{font-size:var(--fs-xs);color:var(--c-text-3);font-weight:500;letter-spacing:.3px}
.nv-t{font-size:var(--fs-sm);font-weight:600;color:var(--c-text-1);display:flex;align-items:center;gap:6px}
.nv-i{font-size:var(--fs-xs);font-weight:600}
.progress{height:4px;background:var(--c-surface-3);border-radius:99px;margin-bottom:18px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--c-brand);border-radius:99px;transition:width var(--motion-slow)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:var(--fs-md);font-weight:600}
.card-h .sub{font-size:var(--fs-xs);color:var(--c-text-3)}
.page-head{margin:6px 0 16px}
.page-head .eyebrow{font-size:var(--fs-xs);color:var(--c-teal);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.page-head h1{font-size:var(--fs-h1);font-weight:700;margin-top:4px;line-height:var(--lh-tight);letter-spacing:.4px}
.page-head p{font-size:var(--fs-sm);color:var(--c-text-2);margin-top:6px;max-width:720px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-1);font-size:var(--fs-sm);font-weight:500;cursor:pointer;transition:var(--motion-fast) var(--ease);font-family:inherit}
.btn:hover{border-color:#c2d0e0;background:var(--c-surface-2)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px}
.btn.primary{background:var(--c-brand);border-color:var(--c-brand);color:#fff}
.btn.primary:hover{background:var(--c-brand-bright);border-color:var(--c-brand-bright)}
.btn.primary .c-icon{transition:transform var(--motion-fast) var(--ease)}
.btn.primary:hover .c-icon{transform:translateX(2px)}
.btn.teal{background:var(--c-teal);border-color:var(--c-teal);color:#fff}
.btn.teal:hover{background:#35A08C}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:var(--fs-xs)}
textarea,input[type=text]{width:100%;border:1px solid var(--c-border);border-radius:9px;padding:10px 12px;font-size:var(--fs-sm);font-family:inherit;color:var(--c-text-1);background:var(--c-surface);resize:vertical;line-height:1.6}
textarea:focus,input:focus{outline:none;border-color:var(--c-brand);box-shadow:0 0 0 3px var(--c-brand-soft)}
textarea.mono{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--c-border);font-size:var(--fs-sm)}
.kv:last-child{border-bottom:none}
.kv .k{width:110px;flex:none;color:var(--c-text-3);font-size:var(--fs-xs);padding-top:1px}
.kv .v{color:var(--c-text-1);word-break:break-all}
.metric{background:var(--c-surface-2);border-radius:10px;padding:12px 14px}
.metric .m-num{font-size:22px;font-weight:700;color:var(--c-brand);line-height:1.2}
.metric .m-lbl{font-size:var(--fs-xs);color:var(--c-text-3);margin-top:2px}
.dim{border:1px solid var(--c-border);border-radius:10px;padding:14px;margin-bottom:10px}
.dim-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dim-name{font-weight:600;font-size:var(--fs-sm)}
.dim-bar{flex:1;height:7px;background:var(--c-surface-3);border-radius:99px;overflow:hidden}
.dim-bar>i{display:block;height:100%;border-radius:99px}
.score{font-weight:700;font-size:var(--fs-md);min-width:38px;text-align:right}
.evidence{font-size:var(--fs-xs);color:var(--c-text-2);margin:6px 0;padding:7px 10px;background:var(--c-surface-2);border-radius:8px;line-height:1.5}
.evidence .t{font-family:"SF Mono",Consolas,monospace;color:var(--c-brand);font-weight:600}
.action{font-size:var(--fs-xs);color:var(--c-teal);margin:4px 0 0;padding-left:4px}
.chat{border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;background:var(--c-surface);max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:9px 13px;border-radius:12px;font-size:var(--fs-sm);line-height:1.55}
.msg.student{align-self:flex-start;background:var(--c-surface-2);border-bottom-left-radius:3px}
.msg.teacher{align-self:flex-end;background:var(--c-brand-soft);border-bottom-right-radius:3px}
.msg.sys{align-self:center;background:var(--c-amber-soft);color:var(--c-amber);font-size:var(--fs-xs);border-radius:8px}
.msg .who{font-size:11px;color:var(--c-text-3);display:block;margin-bottom:2px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1}
.table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.table th,.table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--c-border);vertical-align:top}
.table th{font-size:var(--fs-xs);color:var(--c-text-3);font-weight:600;background:var(--c-surface-2)}
.table tr:last-child td{border-bottom:none}
.radar-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
/* 2.5D 雷达：自适应 + 节点 hover（无霓虹发光） */
.radar-svg{display:block;max-width:100%;height:auto}
.rd-node{cursor:pointer}
.rd-node .rd-core{stroke-width:2;transition:stroke-width var(--motion-fast)}
.rd-node .rd-ring{opacity:0;transition:opacity var(--motion-fast)}
.rd-node:hover .rd-core{stroke-width:2.6}
.rd-node:hover .rd-ring{opacity:.16}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--c-text-2)}
.legend .dot{width:11px;height:11px;border-radius:3px}
.muted{color:var(--c-text-3);font-size:var(--fs-xs)}
.note{font-size:var(--fs-xs);color:var(--c-text-3);background:var(--c-surface-2);border-radius:8px;padding:9px 12px;line-height:1.55}
.err{font-size:12.5px;color:#c0392b;line-height:1.5;background:#fdecea;border:1px solid #f5c6c0;border-radius:8px;padding:8px 12px}
.err:empty{display:none}
.tip-ico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--c-surface-2);border:1px solid var(--c-border);color:var(--c-text-3);font-size:11px;line-height:1;cursor:help;margin-left:6px;vertical-align:middle}
.tip-ico .tip-body{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:250px;background:#16324B;color:#fff;font-size:12px;line-height:1.55;text-align:left;padding:8px 11px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity var(--motion-fast) var(--ease),visibility var(--motion-fast);z-index:40;pointer-events:none}
.tip-ico .tip-body::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#16324B}
.tip-ico:hover .tip-body{opacity:1;visibility:visible}
.divider{height:1px;background:var(--c-border);margin:14px 0}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2733;color:#fff;padding:10px 16px;border-radius:9px;font-size:var(--fs-sm);box-shadow:0 6px 20px rgba(0,0,0,.18);animation:tin var(--motion-normal)}
.toast.warn{background:var(--c-amber)}
.toast.ok{background:var(--c-teal)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.footer{margin-top:22px;text-align:center;font-size:var(--fs-xs);color:var(--c-text-3)}
.mono{font-family:"SF Mono",Consolas,Menlo,monospace}
/* ===== 三栏工作台骨架 ===== */
body{overflow:hidden}
.app{max-width:none;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
.app>.topbar{height:64px;margin:0;padding:0 20px;border-bottom:1px solid var(--c-border);background:var(--c-surface);flex:none;flex-wrap:nowrap}
.workspace{flex:1;display:grid;grid-template-columns:1fr 304px;min-height:0}
/* 独立首页：主区占满整行，隐藏执行轨迹 */
.workspace.home-mode{grid-template-columns:1fr}
.workspace.home-mode .agentrail{display:none}
.sidebar{background:var(--c-surface);border-right:1px solid var(--c-border);overflow-y:auto;padding:14px 12px}
.sidebar .nav{flex-direction:column;border:none;padding:0;margin:0;background:transparent;overflow:visible}
.sidebar .nav-item{min-width:0;flex:none;margin-bottom:4px;border-left:3px solid transparent}
.sidebar .nav-item.active{border-left-color:var(--c-brand)}
.sidebar .home-entry{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--c-text-1);border:1px solid transparent;transition:var(--motion-fast)}
.sidebar .home-entry:hover{background:var(--c-surface-2)}
.sidebar .home-entry.active{background:var(--c-brand-soft);border-color:var(--c-brand);color:var(--c-brand)}
.sidebar .side-sec{margin:16px 2px 6px;font-size:11px;color:var(--c-text-3);font-weight:600;letter-spacing:.5px}
.sidebar .progress{height:6px;margin:12px 4px 0}
.main{overflow-y:auto;min-width:0;padding:26px 30px 0;background:var(--c-bg)}
.agentrail{position:relative;background:var(--c-surface);border-left:1px solid var(--c-border);overflow-y:auto;padding:16px 14px}
.task-action-bar{position:sticky;bottom:0;z-index:5;margin:18px -30px 0;padding:12px 30px 20px;background:linear-gradient(180deg,rgba(245,248,251,.2),var(--c-bg) 45%);border-top:1px solid var(--c-border);backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px}
.task-action-bar .tab-left{font-size:var(--fs-xs);color:var(--c-text-3);display:flex;align-items:center;gap:6px;margin-right:auto}
.task-action-bar .tab-left b{color:var(--c-text-1);font-weight:700}
.task-action-bar .tab-actions{display:flex;align-items:center;gap:10px}
.task-action-bar .btn-lg{min-width:220px}
.task-action-bar .btn.ghost{min-width:0}
.rail-toggle{display:none;width:30px;height:30px;margin:0 auto 10px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-2);cursor:pointer;align-items:center;justify-content:center;transition:var(--motion-fast)}
.rail-toggle:hover{color:var(--c-brand);border-color:var(--c-brand)}
.rail-collapse{width:22px;height:22px;flex:none;margin-left:auto;border-radius:6px;border:1px solid var(--c-border);background:transparent;color:var(--c-text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;transition:var(--motion-fast)}
.rail-collapse:hover{color:var(--c-brand);border-color:var(--c-brand)}
.rail-mini{display:none;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.rm-dot{width:8px;height:8px;border-radius:50%;flex:none}
.rm-dot.s0{background:var(--c-surface-3)}
.rm-dot.s1{background:var(--c-brand)}
.rm-dot.s2{background:var(--c-teal)}
.rm-dot.s3{background:var(--c-amber)}
.rm-dot.s4{background:var(--c-red)}
.workspace.rail-collapsed{grid-template-columns:1fr 44px}
.workspace.rail-collapsed .agentrail{padding:10px 6px;overflow:hidden}
.workspace.rail-collapsed .agentrail .rail-content{display:none}
.workspace.rail-collapsed .agentrail .rail-toggle{display:flex}
.workspace.rail-collapsed .agentrail .rail-mini{display:flex}
.guide-flash{animation:guideflash 1.6s var(--ease)}
@keyframes guideflash{0%,100%{box-shadow:0 0 0 0 rgba(46,139,128,0)}20%{box-shadow:0 0 0 6px rgba(46,139,128,.35)}}
@media(max-width:1280px){.workspace{grid-template-columns:1fr 280px}}
@media(max-width:1152px){.workspace{grid-template-columns:1fr 256px}}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.agentrail{display:none}}
/* ===== 组件层 APP.C ===== */
.c-icon{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.c-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px}
.c-badge.idle{background:var(--c-surface-3);color:var(--c-text-3)}

.c-badge.fail{background:var(--c-red-soft);color:var(--c-red)}
@keyframes breath{0%,100%{box-shadow:0 0 0 0 rgba(44,122,157,.25)}50%{box-shadow:0 0 0 6px rgba(44,122,157,0)}}
.c-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
/* ===== AgentRail ===== */
.rail-h{display:flex;align-items:center;gap:8px;padding:2px 2px 12px;border-bottom:1px solid var(--c-border);margin-bottom:12px}
.rail-h .t{font-size:13px;font-weight:600;color:var(--c-text-1)}
.rail-step{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--c-border)}
.rail-step:last-child{border-bottom:none}
.rail-ico{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.rail-ico.s0{background:var(--c-surface-3);color:var(--c-text-3)}
.rail-ico.s1{background:var(--c-brand)}
.rail-ico.s2{background:var(--c-teal)}
.rail-ico.s3{background:var(--c-amber)}
.rail-ico.s4{background:var(--c-red)}
.rail-body{flex:1;min-width:0}
.rail-t{font-size:13px;font-weight:600;color:var(--c-text-1)}
.rail-d{font-size:12px;color:var(--c-text-2);line-height:1.5;margin-top:2px}
.rail-evi{font-size:11px;color:var(--c-text-3);margin-top:4px;padding:5px 8px;background:var(--c-surface-2);border-radius:6px}
.rail-none{font-size:12px;color:var(--c-text-3);text-align:center;padding:24px 0;line-height:1.7}
/* ===== 首页 ===== */
.home-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:6px 2px 20px;border-bottom:1px solid var(--c-border);margin-bottom:20px;flex-wrap:wrap}
.home-hero h1{font-size:clamp(40px,5.6vw,68px);font-weight:700;color:var(--c-ink);line-height:1.24;letter-spacing:.02em;margin-top:14px}
.home-hero .lead{font-size:16.5px;color:var(--c-text-2);margin-top:18px;max-width:640px;line-height:1.85}
.home-hero .cta{flex:none;margin-top:20px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--c-brand);margin-bottom:12px}
.eyebrow::before{content:'';width:22px;height:2px;background:linear-gradient(90deg,var(--brand-accent-1),var(--brand-accent-3));border-radius:2px}
.eyebrow .c-icon{width:15px;height:15px}
.home-hero-copy{flex:1;min-width:0;max-width:640px}
.home-hero-anchor{flex:none;width:300px;height:168px;border-radius:18px;background:linear-gradient(135deg,var(--brand-accent-1),var(--brand-accent-2) 52%,var(--brand-accent-3));position:relative;overflow:hidden;box-shadow:0 16px 36px -22px rgba(44,122,157,.55)}
.home-hero-anchor::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 150% at 82% 12%,rgba(255,255,255,.30),rgba(255,255,255,0) 44%)}
.landing-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:4px 0 2px}
.lf-step{background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.lf-head{display:flex;align-items:center;justify-content:space-between}
.lf-ico{width:34px;height:34px;border-radius:9px;background:var(--c-brand-soft);color:var(--c-brand);display:flex;align-items:center;justify-content:center}
.lf-ico svg{width:18px;height:18px}
.lf-num{font-size:11px;font-weight:700;color:var(--c-text-3);letter-spacing:.5px}
.lf-t{font-size:13px;font-weight:600;color:var(--c-text-1)}
@media(max-width:1152px){.landing-flow{grid-template-columns:repeat(3,1fr)}.home-hero-anchor{width:240px}}
@media(max-width:900px){.landing-flow{grid-template-columns:repeat(2,1fr)}.home-hero-anchor{display:none}}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.home-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.home-card h3{font-size:13px;font-weight:600;color:var(--c-text-3);letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.home-kv{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--c-border);font-size:14px}
.home-kv:last-child{border-bottom:none}
.home-kv .k{width:88px;flex:none;color:var(--c-text-3);font-size:12px;padding-top:1px}
.home-kv .v{color:var(--c-text-1);font-weight:500}
.skill-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-row .nm{width:76px;flex:none;font-size:13px;color:var(--c-text-2)}
.skill-row .bar{flex:1;height:8px;background:var(--c-surface-3);border-radius:99px;overflow:hidden}
.skill-row .bar>i{display:block;height:100%;border-radius:99px;background:var(--c-brand)}
.skill-row .sc{width:34px;flex:none;text-align:right;font-weight:700;font-size:13px;color:var(--c-text-1)}
.skill-row.weak .bar>i{background:var(--c-amber)}
.skill-row.weak .sc{color:var(--c-warn)}
.skill-row.weak .nm{color:var(--c-warn);font-weight:600}
.task-banner{background:var(--c-ink);color:#fff;border-radius:var(--radius);padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.task-banner .tb-t{font-size:15px;font-weight:600}
.task-banner .tb-d{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px;max-width:560px}
/* ===== Step2 证据工作台 ===== */
.eb-band{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.eb-metric{background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px;padding:14px 16px;position:relative}
.eb-metric.accent{background:linear-gradient(135deg,var(--c-brand),var(--c-ink));border-color:transparent}
.eb-metric.accent .n,.eb-metric.accent .l,.eb-metric.accent .hint{color:#fff}
.eb-metric .n{font-size:26px;font-weight:700;line-height:1.05;color:var(--c-text-1)}
.eb-metric .l{font-size:12px;color:var(--c-text-3);margin-top:5px}
.eb-metric::after{content:'ⓘ';position:absolute;top:10px;right:12px;font-size:10px;line-height:1;color:var(--c-text-3);opacity:.55;pointer-events:none}
.eb-metric:hover::after{color:var(--c-brand);opacity:1}
.eb-metric.accent::after{color:#fff;opacity:.7}
.eb-metric .hint{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);background:#16324B;color:#fff;font-size:11px;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity var(--motion-fast) var(--ease),visibility var(--motion-fast);pointer-events:none}
.eb-metric .hint::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#16324B}
.eb-metric:hover .hint{opacity:1;visibility:visible}
.eb-metric.accent .hint{background:#0f2436}
.eb-cols{display:grid;grid-template-columns:minmax(340px,1fr) 320px;gap:14px;margin-bottom:14px;align-items:stretch}
.eb-panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.eb-panel h3{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.eb-panel .sub{font-size:12px;color:var(--c-text-3)}
.eb-verdict{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.eb-verdict .big{font-size:34px;font-weight:700;line-height:1;color:var(--c-ink)}
.eb-verdict .big small{font-size:14px;font-weight:500;color:var(--c-text-3)}
.eb-find{margin-bottom:10px}
.eb-find .ft{font-size:11px;color:var(--c-text-3);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.eb-find .fi{font-size:13px;color:var(--c-text-1);padding:7px 10px;background:var(--c-surface-2);border-radius:8px;margin-bottom:6px;line-height:1.5}
.eb-find .fi::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c-amber);margin-right:7px;vertical-align:1px}
.eb-flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.eb-flow .f{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--c-surface-2);color:var(--c-text-3)}
.eb-flow .f.on{background:var(--c-teal-soft);color:var(--c-teal)}
.eb-flow .f.off{background:var(--c-amber-soft);color:var(--c-amber)}
/* 问题证据卡 */
.pc{border:1px solid var(--c-border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.pc-top{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--c-surface-2);border-bottom:1px solid var(--c-border)}
.pc-score{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:var(--c-surface);border:1px solid var(--c-border)}
.pc-info{flex:1;min-width:0}
.pc-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-prob{font-size:12px;color:var(--c-text-2);margin-top:3px;line-height:1.5}
.pc-check{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-text-3);padding:6px 12px;border:1px solid var(--c-border);border-radius:999px;cursor:pointer;background:var(--c-surface);transition:var(--motion-fast);user-select:none}
.pc-check:hover{border-color:var(--c-teal);color:var(--c-teal)}
.pc-check.on{background:var(--c-teal-soft);border-color:var(--c-teal);color:var(--c-ok)}
.pc-check .mk{width:14px;height:14px;border-radius:4px;border:1px solid var(--c-text-3);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.pc-check.on .mk{background:var(--c-teal);border-color:var(--c-teal);color:#fff}
.pc-body{padding:6px 16px 12px}
.pc-sec{margin-top:10px}
.pc-lbl{font-size:11px;font-weight:600;color:var(--c-text-3);letter-spacing:.5px;margin-bottom:5px}
.pc-ev{font-size:12.5px;color:var(--c-text-1);padding:7px 10px;background:var(--c-surface-2);border-radius:8px;margin-bottom:5px;line-height:1.5}
.pc-crit{font-size:12px;color:var(--c-text-2);padding:7px 10px;background:var(--c-brand-soft);border-radius:8px;line-height:1.5}
.pc-act{font-size:12.5px;color:var(--c-teal);padding:4px 10px 4px 0;line-height:1.5}
.pc-act::before{content:'→ ';font-weight:600}
details.pc summary.pc-top{cursor:pointer;list-style:none;user-select:none}
details.pc summary.pc-top::-webkit-details-marker{display:none}
details.pc summary.pc-top:hover{background:#eaf1f6}
details.pc summary.pc-top::after{content:'▾';flex:none;color:var(--c-text-3);font-size:12px;width:16px;text-align:center;transition:transform var(--motion-fast) var(--ease)}
details.pc[open] summary.pc-top::after{transform:rotate(180deg)}
details.pc[open] summary.pc-top{border-bottom:1px solid var(--c-border)}
.pc-check{font-family:inherit}
.tl-link{font-family:"SF Mono",Consolas,monospace;color:var(--c-brand);font-weight:600;cursor:pointer;border-bottom:1px dashed var(--c-brand)}
.tl-link:hover{color:var(--c-teal);border-color:var(--c-teal)}
/* 时间线 */
.tl{position:relative;margin-left:6px;padding-left:20px;border-left:2px solid var(--c-surface-3)}
.tl-item{position:relative;padding:7px 0 7px 0}
.tl-item::before{content:'';position:absolute;left:-27px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--c-surface-3);border:2px solid var(--c-surface)}
.tl-item.pause::before{background:var(--c-text-3)}
.tl-item.q::before{background:var(--c-brand)}
.tl-item.mc::before{background:var(--c-red)}
.tl-time{font-family:"SF Mono",Consolas,monospace;font-size:11px;color:var(--c-text-3);margin-right:8px}
.tl-txt{font-size:13px;color:var(--c-text-1);display:inline}
.tl-item.pause .tl-txt{color:var(--c-text-3);font-size:12px}
.tl-item.q .tl-txt{color:var(--c-brand)}
.tl-item.mc .tl-txt{color:var(--c-red)}
.tl-item.flash{animation:tlflash var(--motion-normal) var(--ease)}
@keyframes tlflash{0%{background:var(--c-brand-soft)}100%{background:transparent}}
.btn-lg{padding:12px 28px;font-size:15px;border-radius:11px}
.eb-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.eb-legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-text-3)}
.eb-legend .dot{width:9px;height:9px;border-radius:50%}
@media(max-width:900px){.eb-band{grid-template-columns:repeat(2,1fr)}.eb-cols{grid-template-columns:1fr}}
/* ===== Step3 模拟课堂控制台 ===== */
.sim-band{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sim-main{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sim-main .chat{border:none;border-radius:0;max-height:420px;background:var(--c-surface-2)}
.sim-coach{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;position:sticky;top:12px}
.sim-coach h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sim-coach .ck{margin-bottom:12px}
.sim-coach .ck .ft{font-size:11px;color:var(--c-text-3);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.sim-coach .ck .fv{font-size:12.5px;color:var(--c-text-1);line-height:1.55;padding:8px 10px;background:var(--c-surface-2);border-radius:8px}
.sim-coach .ck .fv.trigger{border-left:3px solid var(--c-amber)}
.sim-coach .ck .fv.next{border-left:3px solid var(--c-teal)}
.sim-coach .ck .fv.goal{border-left:3px solid var(--c-brand)}
@media(max-width:900px){.sim-band{grid-template-columns:repeat(2,1fr)}}
/* ===== Step3（UI-SIM 重构）：选学生 / 进入课堂 / 课堂 / 分析 / 建议 ===== */
/* A 选学生 */
.sim-stu-pick{border:1px solid var(--c-border);border-radius:12px;padding:14px;background:var(--c-surface);cursor:pointer;transition:var(--motion-fast) var(--ease)}
.sim-stu-pick:hover{border-color:var(--c-brand);box-shadow:0 4px 14px rgba(24,95,165,.10)}
.sim-stu-pick.sel{border-color:var(--c-brand);box-shadow:0 0 0 3px var(--c-brand-soft)}
.sim-stu-pick .nm{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sim-stu-pick .nm .st-dot{width:8px;height:8px;border-radius:50%;background:var(--c-surface-3);flex:none}
.sim-stu-pick.sel .nm .st-dot{background:var(--c-teal)}
.sim-stu-pick .ct{font-size:12.5px;color:var(--c-text-2);line-height:1.55;margin-top:5px}
.sim-stu-pick .hb{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.sim-stu-pick .hb span{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--c-surface-2);color:var(--c-text-3)}
.sim-pick-cta{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px}
/* B/E 转场与分析状态页 */
.sim-stage{max-width:520px;margin:5vh auto 0;text-align:center;padding:32px 26px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;box-shadow:var(--shadow)}
.sim-stage .st-icon{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c-brand-soft);color:var(--c-brand);animation:breath 1.8s var(--ease) infinite}
.sim-stage h2{font-size:19px;font-weight:700;margin-bottom:6px}
.sim-stage .sub{font-size:13px;color:var(--c-text-3);line-height:1.7}
.sim-stage .meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--c-border);display:flex;flex-direction:column;gap:8px;text-align:left}
.sim-stage .meta .row{display:flex;justify-content:space-between;gap:14px;font-size:12.5px}
.sim-stage .meta .k{color:var(--c-text-3);flex:none}
.sim-stage .meta .v{font-weight:600;text-align:right}
/* C 模拟课堂：对话区为绝对视觉中心 */
.sim-room{display:flex;flex-direction:column;height:calc(100vh - 172px);min-height:420px}
.sim-band.sim-band-one{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;flex:none}
.sim-band-one .av{width:34px;height:34px;border-radius:50%;background:var(--c-brand-soft);color:var(--c-brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sim-band-one .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.sim-band-one .nm .st-dot{width:8px;height:8px;border-radius:50%;background:var(--c-teal);animation:breath 1.8s var(--ease) infinite}
.sim-band-one .ct{font-size:11.5px;color:var(--c-text-3);margin-top:2px}
.sim-band-one .sp{flex:1}
.sim-body{flex:1;display:grid;grid-template-columns:1fr 220px;gap:12px;min-height:0}
.sim-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sim-main .chat{flex:1;min-height:0;max-height:none;border:none;border-radius:0;background:var(--c-surface-2)}
.sim-inputbar{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--c-border);background:var(--c-surface)}
.sim-inputbar input{flex:1}
.sim-inputbar .btn{padding:8px 18px}
.sim-inputbar .sim-menu{position:relative;flex:none;display:flex;align-items:center}
.sim-menu-pop{position:absolute;right:0;bottom:calc(100% + 8px);background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:158px;z-index:20;display:none}
.sim-menu-pop.open{display:block}
.sim-menu-pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--c-text-1);cursor:pointer}
.sim-menu-pop button:hover{background:var(--c-surface-2)}
.sim-coach{display:flex;flex-direction:column;gap:10px;padding:14px}
.sim-coach h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sim-coach .goal{font-size:12.5px;color:var(--c-text-1);line-height:1.6;padding:9px 11px;background:var(--c-surface-2);border-left:3px solid var(--c-brand);border-radius:8px}
.sim-coach .sp{flex:1}
.sim-coach .hint{font-size:11.5px;color:var(--c-text-3);line-height:1.6}
.sim-coach .btn{width:100%}
.sim-coach .btn.ghost{padding:6px 10px}
.msg.flash{animation:tlflash 1.8s var(--ease)}
/* F 整体建议 */
.src-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--c-text-3);background:var(--c-surface-2);border-radius:999px;padding:3px 10px}
.advice-list{display:flex;flex-direction:column;gap:12px}
.advice-item{border:1px solid var(--c-border);border-radius:12px;padding:14px 16px;background:var(--c-surface)}
.advice-item .ai-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.advice-item .ai-n{width:22px;height:22px;border-radius:50%;background:var(--c-brand-soft);color:var(--c-brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.advice-item .ai-t{font-size:14px;font-weight:700}
.advice-item .ai-row{display:flex;gap:8px;font-size:12.5px;line-height:1.65;margin-top:6px}
.advice-item .ai-k{flex:none;width:64px;color:var(--c-text-3)}
.advice-item .ai-v{flex:1;min-width:0}
.advice-item .ai-ev{color:var(--c-text-2);font-style:italic}
.advice-item .ai-act{margin-top:10px;display:flex;justify-content:flex-end}
.cmp-focus-banner{display:flex;align-items:center;gap:8px;background:var(--c-brand-soft);color:var(--c-brand);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
@media(max-width:900px){.sim-body{grid-template-columns:1fr}.sim-room{height:auto}}
/* ===== Step4 重讲对比 ===== */
.reteach-focus{border:1px solid var(--c-brand);background:linear-gradient(180deg,#fff,var(--c-brand-soft));padding:22px 22px;border-radius:var(--radius);margin-bottom:14px}
.rf-eyebrow{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--c-brand);letter-spacing:.3px}
.rf-title{font-size:var(--fs-2xl);font-weight:700;color:var(--c-text-1);line-height:1.3;margin-top:10px}
.rf-meta{font-size:var(--fs-sm);color:var(--c-text-2);margin-top:8px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cmp-side{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cmp-side h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cmp-side .avg{font-size:32px;font-weight:700;color:var(--c-ink);line-height:1}
.cmp-side .avg small{font-size:14px;font-weight:500;color:var(--c-text-3)}
.cmp-mini{margin-top:12px;border:1px dashed var(--c-border);border-radius:9px;background:var(--c-surface)}
.cmp-mini summary{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;color:var(--c-text-3);cursor:pointer;list-style:none;user-select:none}
.cmp-mini summary::-webkit-details-marker{display:none}
.cmp-mini summary::before{content:'▸';font-size:11px;transition:transform var(--motion-fast) var(--ease)}
.cmp-mini[open] summary::before{transform:rotate(90deg)}
.cmp-mini summary:hover{color:var(--c-brand)}
.cmp-mini .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 10px}
.cmp-mini .m{background:var(--c-surface-2);border-radius:8px;padding:8px 10px}
.cmp-mini .m .n{font-size:16px;font-weight:700;color:var(--c-text-1)}
.cmp-mini .m .l{font-size:11px;color:var(--c-text-3);margin-top:2px}
.cmp-item{border:1px solid var(--c-border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--c-surface)}
.cmp-item.focus{border-left:3px solid var(--c-brand);border-color:var(--c-brand);background:#f4fafd}
.cmp-item summary{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;list-style:none;user-select:none}
.cmp-item summary::-webkit-details-marker{display:none}
.cmp-item summary:hover{background:var(--c-surface-2)}
.cmp-name{font-size:13px;font-weight:600;flex:1}
.cmp-delta{font-size:13px;font-weight:700}
.cmp-item.up .cmp-delta{color:var(--c-ok)}
.cmp-item.down .cmp-delta{color:var(--c-red)}
.cmp-item.flat .cmp-delta{color:var(--c-text-3)}
.cmp-abs{font-size:12px;color:var(--c-text-3);font-family:"SF Mono",Consolas,monospace}
.cmp-body{padding:6px 14px 12px;border-top:1px dashed var(--c-border)}
.cmp-ev{font-size:12.5px;color:var(--c-text-1);line-height:1.6;margin-top:8px}
.cmp-side-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:5px;margin-right:6px}
.cmp-ev .cmp-side-tag{background:var(--c-brand-soft);color:var(--c-brand)}
.cmp-ev.after .cmp-side-tag{background:var(--c-teal-soft);color:var(--c-teal)}
/* ===== Step5 成长档案 ===== */
.trend{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:12px 14px;background:linear-gradient(135deg,#eef6fa,#f7fafc);border:1px solid var(--c-border);border-radius:10px}
.trend-chart{flex:1;min-width:0}
.trend-chart .spark{display:block}
.trend-side{flex:none;text-align:right;padding-left:14px;border-left:1px dashed var(--c-border)}
.trend-val{font-size:26px;font-weight:700;color:var(--c-brand);line-height:1;letter-spacing:-.5px}
.trend-val small{font-size:12px;font-weight:500;color:var(--c-text-3);margin-left:2px}
.trend-cap{font-size:12px;color:var(--c-text-3);margin-top:4px}
.grow-tl{position:relative;margin-left:6px;padding-left:20px;border-left:2px solid var(--c-surface-3)}
.grow-item{position:relative;padding:10px 0}
.grow-item::before{content:'';position:absolute;left:-27px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c-brand);border:2px solid var(--c-surface)}
.grow-item .gt{font-size:11px;color:var(--c-text-3);font-family:"SF Mono",Consolas,monospace}
.grow-item .gl{font-size:13px;font-weight:600;margin-top:2px}
.grow-item .gd{font-size:12px;color:var(--c-text-2);margin-top:2px}
.pmap{display:flex;gap:8px;flex-wrap:wrap}
.pmap .pm{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--c-surface-2);color:var(--c-text-1)}
.pmap .pm b{color:var(--c-red);margin-left:4px}
.pmap .empty{font-size:12px;color:var(--c-text-3)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.review-box textarea{width:100%;box-sizing:border-box;min-height:80px;border:1px solid var(--c-border);border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical}
.ai-note{font-size:12.5px;color:var(--c-text-1);line-height:1.6;padding:8px 10px;background:var(--c-brand-soft);border-radius:8px}
/* ===== Step1 采集入口 ===== */
.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.entry-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);transition:transform var(--motion-fast) var(--ease),border-color var(--motion-fast) var(--ease)}
.entry-card:hover{transform:translateY(-2px);border-color:var(--c-brand)}
.entry-card .ec-icon{width:40px;height:40px;margin:0 auto 10px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--c-brand-soft);color:var(--c-brand)}
.entry-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.entry-card p{font-size:12px;color:var(--c-text-3);margin-bottom:12px;line-height:1.5}
.entry-card{position:relative}
.entry-card.sample{border-color:var(--c-amber);background:linear-gradient(180deg,#fff,var(--c-amber-soft))}
.entry-card.sample .ec-icon{background:var(--c-amber-soft);color:var(--c-amber)}
.ec-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--c-amber);color:#fff;font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(199,122,46,.35)}
.io-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.io-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--c-text-2);background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:999px;padding:5px 12px;font-weight:500}
.io-chip b{color:var(--c-text-1);font-weight:600}
.entry-file{display:inline-flex}
.entry-file input{display:none}
/* Step1 采集入口（重排：上传主入口 → 样例 → 其他方式折叠） */
.upload-primary{text-align:center;padding:26px 20px;border:1px solid var(--c-brand);background:linear-gradient(180deg,#fff,var(--c-brand-soft))}
.upload-primary .up-title{display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--fs-lg);font-weight:700;color:var(--c-text-1)}
.upload-primary .up-title .c-icon{color:var(--c-brand)}
.upload-primary .up-desc{font-size:var(--fs-sm);color:var(--c-text-2);margin:6px 0 16px}
.btn-block{width:100%;justify-content:center}
.sample-row{display:flex;gap:10px;align-items:center}
.sample-row select{flex:1;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-1);font-size:var(--fs-sm);font-family:inherit}
.other-methods{border:1px dashed var(--c-border);background:var(--c-surface)}
.other-methods summary{display:flex;align-items:center;gap:8px;padding:14px 16px;font-size:var(--fs-sm);font-weight:600;color:var(--c-text-2);cursor:pointer;list-style:none;user-select:none}
.other-methods summary::-webkit-details-marker{display:none}
.other-methods summary::before{content:'▸';font-size:12px;transition:transform var(--motion-fast) var(--ease);color:var(--c-text-3)}
.other-methods[open] summary::before{transform:rotate(90deg)}
.other-methods summary:hover{color:var(--c-brand)}
.other-methods .other-body{padding:2px 16px 16px;border-top:1px solid var(--c-border)}
.other-methods .other-body>*{margin-top:12px}
.other-methods .other-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.collect-ready .card-h{margin-bottom:14px}
.meta-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.meta-item{background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;min-width:0}
.meta-item .k{display:block;font-size:11px;color:var(--c-text-3);margin-bottom:4px;letter-spacing:.3px}
.meta-item .v{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--c-text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:900px){.meta-grid{grid-template-columns:repeat(2,1fr)}.sample-row{flex-direction:column;align-items:stretch}}
/* 录制面板 */
.rec-panel{border:1px solid var(--c-red);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;background:linear-gradient(180deg,#fff,var(--c-red-soft))}
.rec-head{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--c-red)}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--c-red);animation:breath 1.2s var(--ease) infinite}
.rec-timer{font-family:"SF Mono",Consolas,monospace;font-size:13px;font-weight:600;color:var(--c-red);margin-left:auto}
.rec-live{margin-top:10px;font-size:13px;color:var(--c-text-2);line-height:1.6;padding:10px 12px;background:var(--c-surface);border:1px dashed var(--c-border);border-radius:9px;min-height:44px}
.rec-actions{display:flex;gap:8px;margin-top:12px}
.rec-meta{font-size:11px;color:var(--c-text-3);margin-top:8px;line-height:1.5}
@media(max-width:900px){.cmp-grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.entry-grid{grid-template-columns:1fr}}
/* ===== 模式切换器 + 设置抽屉（新增） ===== */
.mode-switch{display:inline-flex;align-items:center;gap:2px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:999px;padding:3px;flex:none}
.mode-switch .ms-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;border:none;background:transparent;color:var(--c-text-2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--motion-normal) var(--ease);white-space:nowrap}
.mode-switch .ms-btn:hover{color:var(--c-text-1)}
.mode-switch .ms-btn.active{background:var(--c-brand);color:#fff;box-shadow:0 2px 6px rgba(44,122,157,.28)}
.mode-switch .ms-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.mode-switch .ms-btn.active .ms-dot{opacity:1}
.gear-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--motion-normal) var(--ease);flex:none}
.gear-btn:hover{color:var(--c-brand);border-color:var(--c-brand);background:var(--c-brand-soft)}
.gear-btn .c-icon{width:17px;height:17px}
.drawer-mask{position:fixed;inset:0;background:rgba(22,50,75,.32);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--motion-normal) var(--ease)}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:340px;max-width:92vw;background:var(--c-surface);z-index:91;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform var(--motion-normal) var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--c-border);flex:none}
.drawer-h .t{font-size:15px;font-weight:700;color:var(--c-text-1)}
.drawer-close{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--c-border);background:transparent;color:var(--c-text-2);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:var(--motion-fast)}
.drawer-close:hover{color:var(--c-red);border-color:var(--c-red)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px}
/* ===== 顶部「训练导航」入口 + 左侧抽屉（ROUND 3） ===== */
.nav-toggle-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-1);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--motion-fast) var(--ease);flex:none;white-space:nowrap}
.nav-toggle-btn:hover{color:var(--c-brand);border-color:var(--c-brand);background:var(--c-brand-soft)}
.nav-toggle-btn:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px}
.nav-toggle-btn .c-icon{width:16px;height:16px}
.drawer-left{left:0;right:auto;width:300px;max-width:88vw;transform:translateX(-100%);border-right:1px solid var(--c-border)}
.drawer-left.open{transform:translateX(0)}
.drawer-brand{flex:none;background:linear-gradient(135deg,var(--brand-accent-1),var(--brand-accent-2) 56%,var(--brand-accent-3));color:#fff;padding:20px 20px 18px}
.drawer-brand .db-t{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.drawer-brand .db-t .logo-mark{width:26px;height:26px}
.drawer-brand .db-d{font-size:12px;color:rgba(255,255,255,.84);margin-top:5px;line-height:1.55}
.drawer-nav{flex:1;overflow-y:auto;padding:14px 12px}
.drawer-nav .nav{display:flex;flex-direction:column;gap:4px;border:none;padding:0;margin:0;background:transparent;overflow:visible}
.drawer-nav .nav-item{flex:none;min-width:0;margin-bottom:4px;padding:11px 12px;border-left:3px solid transparent;display:block;border-radius:9px}
.drawer-nav .nav-item.active{background:var(--c-brand-soft);border-left-color:var(--c-brand)}
.drawer-nav .home-entry{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--c-text-1);border:1px solid transparent;transition:var(--motion-fast)}
.drawer-nav .home-entry:hover{background:var(--c-surface-2)}
.drawer-nav .home-entry.active{background:var(--c-brand-soft);border-color:var(--c-brand);color:var(--c-brand)}
.drawer-nav .nv-i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none}
.drawer-nav .nv-i svg{width:17px;height:17px}
.drawer-nav .nav-item.done .nv-i{background:var(--c-teal-soft);color:var(--c-ok);border-radius:50%}
.drawer-sec{margin-bottom:22px}
.drawer-sec .ds-lbl{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--c-text-3);margin-bottom:8px}
.drawer-sec .ds-desc{font-size:12px;color:var(--c-text-2);line-height:1.55;margin-bottom:10px}
.seg{display:flex;gap:2px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:10px;padding:3px}
.seg .seg-btn{flex:1;padding:8px 10px;border:none;background:transparent;color:var(--c-text-2);font-size:12.5px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit;transition:var(--motion-fast)}
.seg .seg-btn.active{background:var(--c-surface);color:var(--c-brand);box-shadow:0 1px 3px rgba(22,50,75,.12)}
.mode-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-cmp .mc{border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.5}
.mode-cmp .mc .mc-t{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.mode-cmp .mc.off .mc-t{color:var(--c-amber)}
.mode-cmp .mc.on .mc-t{color:var(--c-brand)}
.mode-cmp .mc .mc-d{color:var(--c-text-2)}
.kv-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--c-border);font-size:12.5px}
.kv-line:last-child{border-bottom:none}
.kv-line .k{color:var(--c-text-3);flex:none}
.kv-line .v{color:var(--c-text-1);font-family:var(--font-mono);font-size:12px;word-break:break-all;text-align:right}
.mode-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.mode-tag.off{background:var(--c-amber-soft);color:var(--c-warn)}
.mode-tag.on{background:var(--c-brand-soft);color:var(--c-brand)}
/* ===== 页面转场 ===== */
.page{animation:pageIn var(--motion-normal) var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .page{animation:none}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
/* ===== 自定义光标（极简笔尖线框 · 仅桌面精确指针；触屏回退系统默认） ===== */
@media (hover:hover) and (pointer:fine){
  html.cc-on, html.cc-on body, html.cc-on body *{ cursor:none !important; }
}
#customCursor{
  position:fixed; left:0; top:0; z-index:999999;
  pointer-events:none; user-select:none;
  opacity:0; will-change:transform;
  transition:opacity .18s var(--ease);
  transform:translate3d(-200px,-200px,0);
}
#customCursor svg{
  display:block; width:20px; height:20px; overflow:visible;
  transition:transform var(--motion-fast) var(--ease);
  filter:drop-shadow(0 0 1px rgba(255,255,255,.9));
}
#customCursor .cc-nib{ stroke:var(--c-brand); stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
#customCursor.cc-hover svg{ transform:scale(1.16); }
#customCursor.cc-hover .cc-nib{ stroke:var(--c-brand-deep); }
#customCursor.cc-down svg{ transform:scale(.86); }
@media (hover:none),(pointer:coarse){
  #customCursor{ display:none !important; }
}
/* ===== 3D 人设卡 CoverFlow（讲台聚光灯） ===== */
.pick-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 10px; }
.pick-head h3{ font-size:16px; font-weight:700; color:var(--c-text-1); }
.pick-head .sub{ font-size:12.5px; color:var(--c-text-3); }
.persona-stage{
  position:relative;
  height:clamp(400px,50vh,520px);
  margin:2px 0 6px;
  perspective:1200px;
  overflow:hidden;
  border-radius:16px;
  border:1px solid var(--c-border);
  background:
    radial-gradient(ellipse at 50% 40%, rgba(44,122,157,.10) 0%, rgba(44,122,157,.03) 45%, transparent 72%),
    var(--c-surface);
  user-select:none;
  touch-action:pan-y;
  outline:none;
}
.persona-stage:focus-visible{ box-shadow:0 0 0 3px var(--c-brand-soft); }
.persona-carousel{ position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; }
.persona-card{
  position:absolute; left:0; top:0;
  width:clamp(260px,28vw,340px);
  height:clamp(360px,44vh,460px);
  transform-style:preserve-3d;
  transition:transform .6s var(--ease), opacity .6s var(--ease), filter .6s var(--ease);
  cursor:pointer;
  will-change:transform,opacity,filter;
}
.pcard-tilt{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .12s ease-out; will-change:transform; }
.pcard-inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .6s var(--ease); }
.persona-card.is-flipped .pcard-inner{ transform:rotateY(180deg); }
.pcard-face{
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:16px;
  border:1px solid var(--c-border);
  background:linear-gradient(180deg,#fff,#fbfdfe);
  box-shadow:0 12px 32px -14px rgba(22,50,75,.22);
  overflow:hidden;
  display:flex; flex-direction:column;
  padding:20px 20px 18px;
}
.pcard-face.back{ transform:rotateY(180deg); background:linear-gradient(180deg,#f3f8fb,#eaf2f8); }
.persona-card.is-selected .pcard-face.front{ border-color:var(--c-brand); box-shadow:0 0 0 3px var(--c-brand-soft),0 16px 40px -16px rgba(22,50,75,.28); }
/* 顶部人设主题色 accent 条 */
.pcard-face.front::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--accent); border-radius:16px 16px 0 0; }
/* 选中 ✓ 徽章：浮动于卡片右上角，translateZ 前移避免被面裁剪 */
.persona-card::after{
  content:'✓'; position:absolute; top:8px; right:8px; z-index:6;
  width:22px; height:22px; border-radius:50%;
  background:var(--c-brand); color:#fff; font-size:13px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px -3px rgba(22,50,75,.45);
  transform:translateZ(30px);
  opacity:0; transition:opacity var(--motion-fast) var(--ease);
}
.persona-card.is-selected::after{ opacity:1; }
/* 正面 */
.pf-head{ display:flex; align-items:center; gap:10px; }
.pf-avatar{
  width:44px; height:44px; border-radius:12px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:700; color:#fff;
  background:linear-gradient(160deg,var(--accent),#16324B);
  box-shadow:0 6px 14px -6px var(--accent);
}
.pf-grade{ margin-left:auto; font-size:12px; color:var(--c-text-3); background:var(--c-surface-2); padding:3px 10px; border-radius:999px; }
.pf-name{ font-size:24px; font-weight:700; color:var(--c-text-1); margin-top:16px; }

      var nodes='';
      for(var i=0;i<vals.length;i++){
        var xPct= vals.length===1 ? 50 : (pad+i*step)/W*100;
        var yVal= pad+(H-pad*2)*(1-(vals[i]-lo)/r);

      }
      return '<div class="spark-wrap">'+svg+nodes+'</div>';
    }
    return svg;
  },

  {id:"mc_web_005", subject:"物理", topic:"加速减速判断", term:"加速减速判断", detectTerms:["加速度是负数一定减速", "加速度变小速度变小", "加速度为负减速", "加速度是负一定减速"], studentLine:"\"加速度是负数，物体一定在做减速运动；加速度变小，速度一定变小。\"", correct:"加速度正负只代表方向；加速减速看加速度与速度方向是否同向；同向时加速度减小，速度依然增大。", fix:"画图展示速度、加速度矢量方向，分类讨论。"},
  {id:"mc_web_006", subject:"物理", topic:"重力方向", term:"重力方向", detectTerms:["重力方向垂直接触面", "重力垂直于接触面", "重力方向垂直", "重力垂直于斜面"], studentLine:"\"重力方向垂直于接触面。\"", correct:"重力方向永远竖直向下，不是垂直接触面。", fix:"斜面上物体受力分析，画出重力、支持力方向做对比。"},
  {id:"mc_web_007", subject:"物理", topic:"合力与分力", term:"合力与分力", detectTerms:["合力一定比分力大", "合力比分力更大", "合力大于分力", "合力一定大于分力"], studentLine:"\"合力一定比分力更大。\"", correct:"合力可以大于、等于或者小于分力，遵循平行四边形定则。", fix:"演示两个反向等大的力，合力为 0。"},
  {id:"mc_web_008", subject:"物理", topic:"超重与失重", term:"超重与失重", detectTerms:["超重就是重力变大", "失重就是重力消失", "失重重力消失", "超重重力变大"], studentLine:"\"超重就是物体重力变大，失重就是物体重力消失了。\"", correct:"超重失重时物体本身重力不变，变化的只是物体对支持面的压力或者拉力；判断依据是加速度方向。", fix:"电梯上升、下降的受力分析。"},
  {id:"mc_web_009", subject:"物理", topic:"曲线运动速度与加速度", term:"曲线运动速度与加速度", detectTerms:["曲线运动速度方向不变", "曲线运动加速度一定变化", "曲线运动速度方向不变"], studentLine:"\"曲线运动速度方向不变，曲线运动加速度一定变化。\"", correct:"曲线运动速度沿轨迹切线方向，时刻改变；加速度可以恒定（平抛），也可以变化（匀速圆周运动）。", fix:"对比平抛运动、匀速圆周运动受力与加速度。"},
  {id:"mc_web_010", subject:"物理", topic:"匀速圆周运动", term:"匀速圆周运动", detectTerms:["匀速圆周运动速度不变", "匀速圆周是匀速", "匀速圆周运动是匀速"], studentLine:"\"匀速圆周运动就是匀速直线运动那种匀速，速度不变。\"", correct:"匀速圆周运动只是速率不变，速度方向时刻改变，属于变速曲线运动。", fix:"画出圆周上不同位置的速度矢量。"},
  {id:"mc_web_011", subject:"物理", topic:"向心力", term:"向心力", detectTerms:["向心力独立存在", "受力分析单独加向心力", "向心力是独立存在的力", "单独加向心力"], studentLine:"\"向心力是一种独立存在的力，受力分析时要单独加上向心力。\"", correct:"向心力是效果力，由其他力（重力、弹力、摩擦力）提供，不是额外新增的独立力。", fix:"圆锥摆受力分析，找到是什么力充当向心力。"},
  {id:"mc_web_012", subject:"物理", topic:"自由落体", term:"自由落体", detectTerms:["重的物体下落快", "重的下落更快", "下落快慢由重量决定", "重物下落更快", "重的物体下落更快"], studentLine:"\"重的物体下落更快，物体下落快慢由重量决定。\"", correct:"真空环境所有物体自由下落加速度相同；空气中下落快慢差异来自空气阻力，不是物体质量。", fix:"牛顿管实验视频演示。"},
  {id:"mc_web_013", subject:"物理", topic:"平衡力和相互作用力", term:"平衡力和相互作用力", detectTerms:["作用力反作用力和平衡力一样", "相互作用力和平衡力没有区别", "相互作用力和平衡力一样", "作用力反作用力和平衡力没有区别"], studentLine:"\"作用力与反作用力和一对平衡力是一样的，没有区别。\"", correct:"作用力反作用力作用在两个物体，同时产生消失；平衡力作用在同一个物体上，一个消失另一个可继续存在。", fix:"静止放在桌面的书本，区分重力、支持力。"},
  {id:"mc_web_014", subject:"物理", topic:"平衡状态", term:"平衡状态", detectTerms:["平衡状态就是速度等于0", "平衡就是静止不动", "速度为零就是平衡", "平衡状态是速度等于零"], studentLine:"\"物体平衡状态就是速度等于 0，静止不动。\"", correct:"平衡状态包含静止、匀速直线运动；速度为零加速度不为零，不属于平衡状态。", fix:"竖直上抛最高点例子辨析。"},
  {id:"mc_web_015", subject:"物理", topic:"热量概念", term:"热量概念", detectTerms:["含有热量", "高温物体含有更多热量", "物体含有热量", "高温物体含热量"], studentLine:"\"高温物体含有更多热量。\"", correct:"热量是过程量，只能说吸收或者放出热量，不能说物体含有热量；内能才是物体具有的能量。", fix:"辨析内能、热量两个名词，举冰块、热水例子。"},
  {id:"mc_web_016", subject:"物理", topic:"分子热运动", term:"分子热运动", detectTerms:["灰尘飞扬是分子热运动", "灰尘是分子热运动", "尘土是分子运动", "灰尘是分子的热运动"], studentLine:"\"灰尘在空中飞扬，这就是分子的热运动。\"", correct:"分子热运动是微观分子无规则运动；灰尘属于宏观固体小颗粒，灰尘飞扬属于机械运动，不是分子热运动。", fix:"区分宏观颗粒与微观分子尺度，对比扩散现象与灰尘运动。"},
  {id:"mc_web_017", subject:"物理", topic:"内能大小判断", term:"内能大小判断", detectTerms:["温度越高内能越大", "温度高内能一定大", "温度高内能大", "温度越高内能越大"], studentLine:"\"物体温度越高，内能就一定越大。\"", correct:"物体内能和温度、质量、物态都有关系；温度高的物体，如果质量很小，内能未必更大。", fix:"对比一小杯沸水与一大盆温水的内能。"},
  {id:"mc_web_018", subject:"物理", topic:"温度、内能、热传递", term:"温度、内能、热传递", detectTerms:["内能等于零", "内能为零", "0度内能为零", "温度为零内能为零", "内能等于0"], studentLine:"\"物体温度为 0℃的时候，物体的内能等于零。\"", correct:"一切物体任何情况下都具有内能；0℃的物体分子仍然在不停做无规则运动，内能不为 0。", fix:"讲解内能来源于分子动能与分子势能，绝对零度才分子动能为零。"},
  {id:"mc_web_019", subject:"物理", topic:"热传递条件", term:"热传递条件", detectTerms:["接触就传热", "接触一定传热", "接触就发生热传递", "接触就传递热量"], studentLine:"\"两个物体接触，热量就一定会发生传递。\"", correct:"发生热传递的唯一条件是存在温度差；温度相同时，即使互相接触，也不会发生热传递。", fix:"0℃冰块放到 0℃水中，分析热量转移情况。"},
  {id:"mc_web_020", subject:"物理", topic:"比热容", term:"比热容", detectTerms:["比热容大升温慢", "比热容大不容易升温", "比热容大一定升温慢", "比热容大升温慢"], studentLine:"\"比热容大的物体，吸收热量之后温度升高一定很慢，所以它一定不容易升温。\"", correct:"吸收相同热量、质量相同时，比热容大升温慢；若质量不同，该结论不成立。", fix:"控制变量对比实验，强调质量要保持一致。"},
  {id:"mc_web_021", subject:"物理", topic:"内燃机做功", term:"内燃机做功", detectTerms:["四个冲程都做功", "四冲程都输出动力", "四个冲程都对外做功", "四个冲程都会做功"], studentLine:"\"内燃机四个冲程，四个冲程都会对外输出动力做功。\"", correct:"内燃机只有做功冲程对外做功；吸气、压缩、排气冲程依靠飞轮惯性完成。", fix:"拆解汽油机四冲程示意图，标注能量转化。"},
  {id:"mc_web_022", subject:"物理", topic:"导体与绝缘体", term:"导体与绝缘体", detectTerms:["绝缘体没有电荷", "绝缘体完全没有电荷", "绝缘体没有电子", "绝缘体没有电荷"], studentLine:"\"绝缘体就是完全没有电荷，所以不能导电。\"", correct:"绝缘体内存在大量电荷，只是自由电荷极少，不容易导电；导体拥有大量可自由移动电荷。", fix:"说明导电本质看自由电荷多少，不是有无电荷。"},
  {id:"mc_web_023", subject:"物理", topic:"电路短路", term:"电路短路", detectTerms:["被短路的用电器烧坏", "短路用电器烧坏", "短路会烧坏用电器", "被短路的用电器会被烧坏"], studentLine:"\"发生短路的时候，被短路的用电器会被烧坏。\"", correct:"用电器被短路，电流不经过该用电器，用电器无电流通过，不会烧坏；电源短路会烧坏电源。", fix:"绘制局部短路电路图，分析电流流向。"},
  {id:"mc_web_024", subject:"物理", topic:"并联电路电压", term:"并联电路电压", detectTerms:["支路越多电压越小", "支路越多分到电压越小", "支路越多电压被分走", "并联各支路电压被分走", "各支路电压被分走", "电压被分走"], studentLine:"\"并联电路，支路越多，每条支路分到的电压就会变小。\"", correct:"电源不变时，并联各支路两端电压都等于电源电压，与支路数量无关。", fix:"多组灯泡并联，用电压表分别测量各支路电压。"},
  {id:"mc_web_025", subject:"物理", topic:"电功与电功率", term:"电功与电功率", detectTerms:["功率越大消耗电能越多", "电功率越大耗电越多", "功率大耗电多", "功率越大耗电越多"], studentLine:"\"电功率越大的用电器，消耗电能就一定更多。\"", correct:"电能消耗多少由电功 W=Pt 决定；电功率大，如果工作时间很短，消耗电能也可以很少。", fix:"对比大功率电灯短时间、小电灯长时间工作消耗电能。"},
  {id:"mc_web_026", subject:"物理", topic:"焦耳定律", term:"焦耳定律", detectTerms:["电能全部转化成内能", "所有用电器电能转内能", "电能全转内能", "电能全部转化为内能"], studentLine:"\"所有用电器工作，电能全部转化成内能。\"", correct:"只有纯电阻用电器电能全部转为内能；电动机主要将电能转化机械能，只有一小部分变成热量。", fix:"分析电动机能量转化，区分纯电阻、非纯电阻。"},
  {id:"mc_web_027", subject:"物理", topic:"磁场与磁感线", term:"磁场与磁感线", detectTerms:["磁感线真实存在", "磁感线是真实存在", "磁感线存在", "磁感线是真实存在的"], studentLine:"\"磁感线是磁场里面真实存在的一条条曲线。\"", correct:"磁场客观真实存在；磁感线是人为建立的物理模型，实际并不存在。", fix:"对比铁粉排布现象，说明磁感线是理想化模型。"},
  {id:"mc_web_028", subject:"物理", topic:"电磁铁磁性", term:"电磁铁磁性", detectTerms:["断电磁性只是变小", "断电磁性变小", "通电一定有很强磁性", "通电磁性很强", "断电后磁性只是变小"], studentLine:"\"电磁铁通电就一定有很强磁性，断电磁性只是变小。\"", correct:"电磁铁通电产生磁性，断电后磁性完全消失；磁性强弱还和电流大小、线圈匝数有关。", fix:"通断电对比电磁铁吸引大头针实验。"},
  {id:"mc_web_029", subject:"物理", topic:"浮力产生原因", term:"浮力产生原因", detectTerms:["浸到液体就受浮力", "浸入液体一定受浮力", "浸到液体一定受浮力", "浸入液体就受浮力"], studentLine:"\"物体只要浸到液体里面，就一定会受到浮力。\"", correct:"浮力来源于液体对物体上下表面压力差；物体底部和容器紧密贴合没有液体，则不受浮力。", fix:"举例桥墩深埋水下，不受浮力。"},
  {id:"mc_web_030", subject:"物理", topic:"机械效率", term:"机械效率", detectTerms:["总功越多效率越高", "总功多机械效率高", "总功越多机械效率越高", "总功越多效率越高"], studentLine:"\"机械做的总功越多，它的机械效率就越高。\"", correct:"机械效率是有用功和总功的比值；总功大，如果额外功占比大，机械效率反而很低。", fix:"举例两台滑轮组，对比总功、有用功、效率。"},
  {id:"mc_hand_001", subject:"物理", topic:"眼睛发光才能看见物体", term:"眼睛发光才能看见物体", detectTerms:["眼睛发光才能看见物体", "眼睛发光", "眼睛发出光", "眼睛会发光", "眼睛发出光才能看见"], studentLine:"\"眼睛发光才能看见物体。\"", correct:"人眼看见物体，是物体反射（或发出）的光进入眼睛，而不是眼睛发出光。", fix:"暗室中用手电照物体：物体本身不发光却能看见，说明是反射光进入眼睛。"}
];

APP.KB.miscMisconceptions = [
  {id:"mc_ai_016", subject:"化学", topic:"纯净物与混合物", term:"纯净物与混合物", detectTerms:["干净透明就是纯净物", "透明的水就是纯净物", "看起来浑浊就是混合物", "干净的水就是纯净物"], studentLine:"\"干净透明的水就是纯净物，看起来浑浊的才是混合物。\"", correct:"纯净物看物质种类，不是外观；干净的自来水含有多种可溶性物质，属于混合物。", fix:"展示蒸馏水、自来水，讲解成分差异。"},
  {id:"mc_ai_017", subject:"化学", topic:"燃烧", term:"燃烧", detectTerms:["燃烧一定需要氧气", "没有氧气不能燃烧", "燃烧需要氧气参与", "没有氧气就不能燃烧"], studentLine:"\"燃烧一定需要氧气参与，没有氧气物质就不能燃烧。\"", correct:"燃烧是发光放热的剧烈氧化反应，部分物质可在氯气、二氧化碳中燃烧，不需要氧气。", fix:"演示镁条在二氧化碳中燃烧视频。"},
  {id:"mc_ai_018", subject:"化学", topic:"质量守恒", term:"质量守恒", detectTerms:["反应后总质量减少", "质量不守恒", "燃烧后变短质量减少", "燃烧质量减少", "反应后质量减少"], studentLine:"\"蜡烛燃烧之后变短消失，说明反应后总质量减少，质量不守恒。\"", correct:"燃烧生成二氧化碳、水蒸气逸散到空气中；密闭体系内总质量保持不变。", fix:"密闭容器内蜡烛燃烧称重对比。"},
  {id:"mc_ai_019", subject:"生物", topic:"光合作用", term:"光合作用", detectTerms:["白天只进行光合作用", "晚上才呼吸", "白天光合晚上呼吸", "晚上才进行呼吸作用"], studentLine:"\"植物白天只进行光合作用，晚上才进行呼吸作用。\"", correct:"植物全天都进行呼吸作用；光合作用仅在有光条件下发生。", fix:"对比黑暗、光照条件下植物二氧化碳释放实验。"},
  {id:"mc_ai_020", subject:"生物", topic:"细胞", term:"细胞", detectTerms:["所有生物都由细胞构成", "所有生物都是细胞构成", "生物都由细胞构成"], studentLine:"\"所有生物都是由细胞构成的。\"", correct:"除病毒以外，绝大多数生物由细胞构成，病毒无细胞结构。", fix:"展示病毒结构示意图，对比动植物细胞。"},
  {id:"mc_ai_021", subject:"生物", topic:"蒸腾作用", term:"蒸腾作用", detectTerms:["蒸腾作用是浪费水", "水分从根部跑掉", "蒸腾浪费水", "蒸腾作用浪费水"], studentLine:"\"植物蒸腾作用是浪费水，水分全部从根部跑掉。\"", correct:"蒸腾作用拉动水和无机盐运输、降低叶片温度；植物吸收的水分绝大部分通过叶片气孔散失，不是根部流失。", fix:"带枝叶的密封塑料袋蒸腾实验。"},

transcript:'[00:00] 上课，同学们好，请坐。\n[00:06] 前面几次课呢我们已经学习了波的产生以及传播，那今天啊我们将从观测者的角度来学习一个非常有趣的物理现象。\n[00:16] （停顿 3 秒）\n[00:19] 那在学习之前呢，老师请大家先看一段视频，请大家关注一下火车驶过的过程中，除了音量大小之外，还有没有什么别的变化？\n[00:32] （板书，停顿 4 秒）\n[00:36] 好，有没有同学愿意分享一下你的发现？\n[00:41] 嗯，这位同学，哦，它的响度发生了变化，那其实响度就是我们的音量，对不对？这是因为我们的响度与人耳距离声源的远近是有关系的。\n[00:53] 还有没有什么别的变化呢？你说什么？哦，它的音调好像有些变化。 [01:02] 你的感觉是对的。\n[01:05] 当火车靠近的时候音调变高了，而远离的时候，音调变低了。诶，那在初中的时候我们就已经学习过了，音调其实是由声音的震动频率所决定的。频率高，音调就高，频率低，音调就低。所以这个现象的实质其实是，相对运动改变了我们接受到的波的频率，因此音调发生了变化。\n[01:28] 在 1842 年，奥地利物理学家多普勒带着女儿在铁道旁散步的时候，偶然发现了这个现象。\n[01:38] 于是就有了我们的多普勒效应。\n[01:42] 也就是当波源和观察者之间有相对运动时，观察者会感受到频率发生变化的现象。\n[01:51] 那定义中呢，有一个非常非常容易出错的点，也就是这里的频率。 [01:58] 这里的频率是指我们接受到的频率，同学们一定要与波源的频率区分开来，我们前面已经学习过，波源的频率是由波源本身的振动决定的，与其他条件无关。\n[02:12] 那么再回到这个定义，大家有没有发现这个定义是比较模糊的？因为它没有描述如何相对运动导致这个测得的频率是怎么变化的。所以接下来，我们来看一个视频，通过实验来一起探究。\n[02:28] （播放视频，停顿 5 秒）\n[02:33] 好，视频已经看完了，相信大家已经对于多普勒效应的定义有了更深入的理解。当波向我们靠近时，接受频率变高。而当波源远离我们时，接受频率变低。这就是多普勒效应。\n[02:48] 那其实啊，我们的生活中处处都是多普勒效应，马路边，校园里都有我们多普勒效应的身影。老师今天刚好带了一个音叉，接下来就给大家现实演示一下，大家更直观地感受这个现象。\n[03:03] （演示音叉，停顿 3 秒）\n[03:06] 大家有没有感觉到明显的音调变化呀，好，感兴趣的同学可以下课来讲台这边体验一下，我们回到课堂。\n[03:15] 那到底为什么会出现这样的现象呢？\n[03:19] 我们把 “波” 想象成一群整齐跑步的学生，把 “观察者” 当成站在一旁的体育老师。当观察者站着不动，队伍以固定速度朝他走来， 10 秒内，有 7 个人从他身边经过，过人频率是 7 人/10s；当观察者迎着队伍走，和队伍相向而行， 同样 10 秒内，有 10 个人从他身边经过，过人频率变成 10 人/ 10s，频率变高了；而当观察者和队伍同向而行： 过人频率又变成低了。\n[03:48] 现在我们把这些跑步的学生，对应成一个个波峰，刚才的过人频率，现在对应声波的频率，而整个队伍呢，其实就是波源。本来当观察者静止的时候，10 秒内会有 7 个波峰经过观察者，而当观察者逆着波源行走时，相同时间内通过观察者的波峰数量就变多了，这个时候呢声波频率也变高了。那其实啊，这就是我们相对运动会改变接收频率的原因。\n[04:14] 由此，我们就可以总结出关键的结论：\n[04:18] 1. 当波源和观察者都静止时，观察者在相同时间里接收到的波的个数，等于波源发出的波的个数。\n[04:27] 也就是接收频率等于发出频率。\n[04:31] 2. 当波源静止，观察者靠近波源时，单位时间内接收到的波峰个数变多了。\n[04:40] 此时，接收频率？大于！发出频率。\n[04:46] 3. 当观察者远离波源时呢？大家一起说！对，接收频率小于发出频率，所以音调降低了。\n[04:56] 好，我们刚才总共讨论了这五种情况，我们现在来总结一下，运动和频率究竟有什么样的关系呢？大家觉得可以分成几类？对，没错，可以分成三类。\n[05:09] 我们令波源频率为 f，接受频率为 f′。波源与观察者相对静止时，f＝f′；相互靠近时，f＜f′；相互远离时，f＞f′。\n[05:22] 那本节课呢我们主要是以声波为例，给大家讲解了我们的多普勒效应，但是大家要注意这个规律并不是声波的专属现象，而是所有波的共同规律。比如说光波，电磁波等等。\n[05:36] 学习物理这门学科呀，我们不仅要学习原理，更应该明白这些原理能解决什么问题，创造什么价值？而多普勒效应的应用，早就渗透到了我们生活的方方面面。交通里的雷达、超声波测速，利用的就是我们声波的多普勒效应；医学上，医生通过反射波的频率变化来判断血流速度，给诊断提供精准依据；而天文学里，科学家利用光的多普勒效应，观测星系的运动，分析它们是远离还是靠近我们，以此探索宇宙的起源和演化。\n[06:18] 同学们，多普勒效应从一个路边的小观察，变成了交通，医学，天文等等领域的核心技术。物理从来都不是书本上枯燥的知识，它源于生活，更实实在在地服务于国家和人民。从交通平安到医疗健康，从地面科技到仰望星空，基础物理规律看似抽象，却是我们破解技术的关键，学好基础物理就是为国家科技发展蓄力。\n[06:38] （停顿 3 秒，课堂结束）',

transcript:'[00:00] 同学们，上课，我们今天要学习的，就是第八章第四节机械能守恒定律。\n[00:07] （切换 PPT，停顿 2 秒）\n[00:09] 那在正式上课之前我们先带着这三个问题来看一个有意思的视频。\n[00:17] （板书，播放视频，停顿 4 秒）\n[00:21] 好，为什么这个健身器材不会撞到视频中的人呢？答案其实就藏在我们今天这堂课中。\n[00:29] （切换 PPT，停顿 2 秒）\n[00:31] 那首先，我们先来一起回顾一下前面我们所学到的伽利略的理想斜面实验。\n[00:38] （板书，停顿 3 秒）\n[00:41] 嗯好，刚才同学们已经回顾了伽利略的理想斜面实验，我们知道在忽略了空气阻力以及摩擦力的前提下，小球如果从 a 点释放，那它一定能够到达与 a 点等高的 c 点。\n[00:54] （切换 PPT，停顿 2 秒）\n[00:56] 那老师现在想来问大家一个问题，在小球运动的过程中，什么样的物理量发生了改变呢？ [01:04] 哪位同学来回答一下？好，小杨你来说。非常好，请坐。\n[01:11] 在这个过程中，我们的速度与高度发生了改变。\n[01:16] （切换 PPT，停顿 2 秒）\n[01:18] 我们前面已经学习过了重力势能以及动能的知识，我们知道这里的速度就对应着动能的改变，高度对应着重力势能的改变。\n[01:28] 诶，那我们今天要研究的呢就是某种能量的守恒对不对？\n[01:33] 我们来试着分析一下 ABC 这三个点（手部动作），他们的动能和重力势能是一个什么样的情况。\n[01:41] 首先，在 a 点我们的小球无初速度释放，所以它的动能为零。我们假设这个 A 点距离地面的高度都为 H，所以它的势能就等于 mgh。\n[01:53] 那好，我们再来分析一下 b 点。这就需要结合我们学过的动能定理的知识了，在这个过程中呢我们忽略了一切的摩擦力和阻力，也就是说这个过程中只有重力做功。而小球从 a 点运动到 b 点，所以重力做功的大小就等于 mgh，等于末动能减去初动能。那我们就可以得到在 b 点它的重力势能为零，而动能大小等于 mgh。好，那现在大家跟我一起说出来 c 点的重力势能和动能的情况。重力势能大小为 mgh，而动能大小等于零。\n[02:27] 大家有没有发现什么神奇的事情？\n[02:31] （切换 PPT，停顿 2 秒）\n[02:33] 在这个过程中，ABC 三个点的重力势能与动能之和都为 mgh。\n[02:39] 这会不会就是我们今天要找的那个守恒量呢？\n[02:44] （切换 PPT，停顿 2 秒）\n[02:46] 我们再接着看第二个情境，试着分析一下这个情境中会不会存在同样的规律。假设这是一个光滑的平面，然后呢这里是一个弹簧，弹簧右边连接着一个小球，这一点就是原点 o，然后老师现在把这个球拉到这里，那么小球就会受到弹力的作用往回拉，对不对？现在我们在中间任取 A，B 两个点，也像刚才那样来分析。\n[03:09] （切换 PPT，停顿 2 秒）\n[03:11] 那么根据动能定理的知识，在这个过程中弹力做功就等于末动能减去初动能，而这个弹力做功的大小，就等于 A 点的弹性势能减去 B 点的弹性势能。根据这两个关系式，我们是不是发现了和刚才一模一样的结论呀？也就是说 a 点和 B 点的弹性势能和动能之和是相等的。\n[03:34] （停顿 2 秒）\n[03:36] 好，现在来总结一下刚才我们讨论的那两个小实验。在第一个情境中，我们忽略了摩擦力与阻力，重力势能和动能通过重力做功进行转化。那第二个模型当中，我们也是同样的忽略了弹力之外的力的影响，所以在这个过程中只有弹力作功，使动能和弹性势能之间发生了转化。\n[03:56] 那学到这里，有没有同学愿意来总结一下你发现的规律呢？ [04:02] （切换 PPT，停顿 2 秒）\n [04:04] 好，那个靠窗的同学你来说。哦，在这个过程中，我们的动能和势能之和都没有发生变化，非常好，请坐。\n[04:14] 是的，这个动能与势能之和就是我们今天要找的守恒量。在这里我们就给出了机械能的定义。\n[04:22] （板书，停顿 3 秒）\n[04:25] 机械能就是物体动能和势能之和，大家需要格外注意的一点就是这里的势能只包括重力势能和弹性势能，那在后面我们还会学习到电势能，那这些就不包含在我们机械能的范围之内了。\n[04:40] 好，同学们，我们今天这堂课学习的主题叫做机械能守恒定律，顾名思义就是说在某个条件下，机械能的大小是不发生变化的。\n[04:51] （切换 PPT，停顿 2 秒）\n[04:53] 那同学们想一想，机械能守恒的条件是什么呢？大家可以小组讨论一下。\n[05:00] （板书，小组讨论，停顿 4 秒）\n[05:04] 好，时间差不多了，哪个小组派一个代表起来说一下？这位同学。哦，我们要忽略一切的摩擦力和空气阻力，说的很接近，但是不完全正确。再想想，好，这个问题有一点点难。我们来看一下，在第一个情境中，我们忽略一切摩擦力和空气阻力，导致了一个什么样的结果？在这个过程中只有重力做功，对不对？那第二个情境中呢？是的，只有弹力做功。也就是说你刚才说到的那个忽略一切摩擦力和空气阻力的条件就是为了导向只有重力做功或者只有弹力做功，这种情况。\n[05:36] （切换 PPT，停顿 2 秒）\n[05:38] 我们机械能守恒的条件其实就是系统内只有重力或者弹力做功，其他力不做功或者做功的代数和为零。\n[05:48] （切换 PPT，停顿 2 秒）\n[05:50] 机械能守恒定律就是在只有重力或者弹力做功的物体系统内，动能和势能可以相互转化，但机械能总量保持不变。\n[05:59] 那么接下来我们来总结回顾一下前面我们学习到的内容。我们重点来看屏幕最右边的这一部分，我们通过动能定理和功能关系，再加上除了重力与弹力之外的力做功代数和为零的这样一个条件，就可以推导出机械能守恒定律。\n[06:16] 那么现在，我们回到今天最开始的这三个问题。相信大家心中已经有了答案。\n[06:22] （切换 PPT，停顿 2 秒）\n[06:24] 好，那么最后老师这里给大家准备了一个课后思考题，请大家分析一下，在以下中国制造中，机械能是否守恒？哪些能量之间发生了转化呢？同学们从我们公园里的太空漫步器材，到福建舰的电磁弹射器，再到白鹤滩水电站的水力发电系统，这些小到基础设施，大到国之重器的设计都与我们的机械能守恒定律息息相关。物理规律看似抽象，却是工程师们破解技术的关键。学好基础物理就是为国家科技发展蓄力。\n[06:52] 我的试讲到此结束，谢谢大家！\n[06:55] （停顿 3 秒，试讲结束）',

/* ===================== #region L2 存储 Store ===================== */
APP.Store = {
  KEY:'qlsj_state_v1',
  fresh:function(){
    return {
      meta:{ createdAt:APP.U.now(), currentStep:'home', lesson:null, mode:'offline' },
      steps:{},
      context:{}
    };
  },
  _initSteps:function(state){
    APP.STEPS.forEach(function(s,i){
      if(!state.steps[s.id]) state.steps[s.id]={ id:s.id, status: i===0?APP.ST.READY:APP.ST.LOCKED, startedAt:null, finishedAt:null };
    });
    return state;
  },
  load:function(){
    var s=null;
    try{ s=JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ s=null; }
    var fresh=this.fresh();
    if(!s || !s.steps){ s=fresh; this._initSteps(s); }
    else{
      this._initSteps(s);
      s.meta = s.meta || fresh.meta;
      if(!s.context) s.context={};
      if(!s.meta.lesson) s.meta.lesson=null;
      if(!s.meta.mode) s.meta.mode='offline';
    }
    return s;
  },
  save:function(state){ try{ localStorage.setItem(this.KEY, JSON.stringify(state)); }catch(e){} },
  reset:function(){ localStorage.removeItem(this.KEY); }
};
APP.state = APP.Store.load();
if(!APP.state.context) APP.state.context={};

  get:function(id){ return APP.state.steps[id]; },

  next:function(id){ var i=APP.STEPS.findIndex(function(s){return s.id===id;}); return (i>=0&&i<APP.STEPS.length-1)?APP.STEPS[i+1].id:null; },
  unlockNext:function(id){ var nx=this.next(id); if(nx && this.get(nx).status===APP.ST.LOCKED){ this.set(nx,APP.ST.READY); } },
  progress:function(){
