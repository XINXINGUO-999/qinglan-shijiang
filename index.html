  recordAudio:function(){
    var R=APP.Recorder;
    if(R.state==='recording'){ APP.act.finishRecording(); return; }
    if(R.state==='starting'){ return; }
    if(!R.supported()){ APP.Toast.show('当前浏览器/环境不支持录音（建议 Chrome，需 HTTPS 或 localhost）','warn'); return; }
    if(!R.secure()){ APP.Toast.show('录音需安全上下文：请通过 _serve.py 本地服务或 HTTPS 打开本页','warn'); return; }
    if(!APP.ASR.available()){ APP.Toast.show('提示：浏览器实时转写不可用，将使用云端整段转写','warn'); }
    APP.renderRecordPanel();
    R.start({
      onStart:function(){ APP.renderRecordPanel(); },
      onTick:function(sec,live){
        var t=APP.U.el('recTimer'); if(t) t.textContent=APP.U.fmtTime(sec);
        var l=APP.U.el('recLive'); if(l && live) l.textContent='「'+live+'」';
      },
      onInterim:function(txt){ var l=APP.U.el('recLive'); if(l && txt) l.textContent='「'+txt+'」'; },
      onError:function(msg){ APP.Toast.show(msg,'warn'); APP.renderRecordPanel(); }
    });
  },
  /* 通用：写入转写稿 + 异步诊断（先离线渲染避免空白，云端 LLM 回来后覆盖） */
  _ingestTranscript:function(text, title, source, durationSec){
    var parsed=APP.Engine.parse(text);
    if(!parsed.segments.length){
      APP.Toast.show('转写结果格式异常，请重试','warn'); APP.renderRecordPanel(); return;
    }
    parsed.raw=text;
    APP.state.context.reviewed={};
    APP.state.context.lesson={ title:title, subject:'物理', grade:'', raw:text, parsed:parsed, source:source, durationSec:durationSec||0 };
    /* 立即用离线诊断渲染，避免界面空白 */
    APP.state.context.diagnosis=APP.Engine.diagnose(parsed);
    APP.state.context.diagnosis.title=title;
    APP.Steps.set('collect',APP.ST.DONE);
    APP.Steps.set('diagnose',APP.ST.REVIEW);
    APP.state.meta.currentStep='collect';
    APP.Store.save(APP.state); APP.render();
    APP.act.guideToDiagnose();
    if(APP.Settings.isOnline()){
      APP.Toast.show('转写完成，正在云端诊断…','ok');
      /* 云端 LLM 异步覆盖诊断结果（失败自动降级，来源写入 d.source） */
      APP.AgentProvider.analyze(parsed, {subject:'物理'}, function(d, src){
        d.title=title;
        d.source=src||'local';
        APP.state.context.diagnosis=d;
        APP.Store.save(APP.state); APP.render();
        APP.Toast.show(src==='cloud'?'云端诊断完成，点击「开始诊断」查看结果':'云端不可用，已使用本地诊断', src==='cloud'?'ok':'warn');
      });
    } else {
      APP.Toast.show('转写完成，离线诊断完成','ok');
    }
  },
  finishRecording:function(){
    var R=APP.Recorder;
    if(R.state!=='recording') return;
    R.stop();
    APP.renderRecordPanel();
    var wait=function(){
      if(R.state!=='idle'){ setTimeout(wait,120); return; }
      /* 优先：云端 ASR 转写 WAV（如有 wavBlob 且 cloud provider 可用） */
      var doLocalFallback=function(){
        var built=R.buildTranscript();
        if(!built.text.trim()){
          APP.Toast.show('未识别到语音内容，请重试或改用「粘贴/上传」','warn');
          APP.renderRecordPanel(); return;
        }
        APP.act._ingestTranscript(built.text, '麦克风录制试讲', 'recorded', built.durationSec);
      };
      if(APP.Settings.isOnline() && R.wavBlob && APP.ASR.has('cloud')){
        APP.Toast.show('正在云端转写音频…','ok');
        APP.ASR.transcribe(R.wavBlob, {provider:'cloud'}, function(res){
          if(res && res.text){
            APP.act._ingestTranscript(res.text, '麦克风录制试讲', 'recorded', res.durationSec||0);
          } else {
            APP.Toast.show('云端转写失败，改用本地实时转写结果','warn');
            doLocalFallback();
          }
        });
      } else {
        doLocalFallback();
      }
    };
    wait();
  },
  cancelRecording:function(){
    APP.Recorder.cancel(); APP.renderRecordPanel();
  },

  sendChat:function(){
    var sim=APP.state.context.sim; if(!sim) return;
    if(sim.pending) return; /* 学生回应中，防止连发 */
    if((sim.stage||'classroom')!=='classroom') return;
    var inp=APP.U.el('chatIn'); if(!inp) return;
    var t=inp.value.trim(); if(!t) return;
    sim.messages.push({who:'teacher', text:t});
    sim.highlightIndex=null;
    inp.value='';
    sim.pending=true;                     /* 学生回应前先显示 typing 指示（在线/离线一致） */
    APP.Store.save(APP.state);
    APP.View.renderChat();                /* 增量更新对话区，输入框不失焦（R7） */
    inp.focus();
    /* 仅让 typing 指示先渲染一帧；sim.pending 表示真实异步请求，不用假计时器模拟思考 */
    setTimeout(function(){
      var cur=APP.state.context.sim;
      if(!cur || cur!==sim) return;
      APP.Simulator.respondRemote(sim, t, function(r, src){
        sim.pending=false;
        if(r.sys) sim.messages.push({who:'sys', text:r.sys});
        sim.messages.push({who:'student', text:r.text});
        sim.lastTrigger=(src==='cloud'?'[云端] ':'')+(r.trigger||'');
        APP.Store.save(APP.state);
        APP.View.renderChat();
        var el=APP.U.el('chatIn'); if(el) el.focus();
      });
    }, 0);
  },
  injectEvent:function(){
    APP.act._closeSimMenu();
    var sim=APP.state.context.sim; if(!sim) return;
    var ev=APP.KB.classroomEvents[Math.floor(Math.random()*APP.KB.classroomEvents.length)];
    /* 突发事件作为状态机外部事件输入，由状态机决定反应 */
    var intent = APP.StudentStateMachine.decide({ sim:sim, message:'', topic:APP.Simulator._topic(),
      externalEvent:{ type:'emergency', kind:ev.kind, text:ev.text, sys:'突发事件：'+ev.kind+'——请给出应对策略。' } });
    sim.turn++;
    var r = APP.Simulator.renderIntent(sim, intent);
    if(r.sys) sim.messages.push({who:'sys', text:r.sys});
    sim.messages.push({who:'student', text:r.text});
    sim.lastTrigger = r.trigger || ('课堂突发：'+ev.kind);
    sim.highlightIndex=null;
    APP.Store.save(APP.state);
    APP.View.renderChat();
    var el=APP.U.el('chatIn'); if(el) el.focus();

  loadReteach:function(){

    var title=APP.KB.sampleLesson.title;

APP.render = function(){
  var nav=APP.U.el('nav'); var view=APP.U.el('view'); var bar=APP.U.el('progressBar'); var rail=APP.U.el('agentrail');
  var cur=APP.state.meta.currentStep;
  var isHome=(cur==='home');
  var ws=document.querySelector('.workspace');
  if(ws){ if(isHome){ ws.classList.add('home-mode'); } else { ws.classList.remove('home-mode'); } }
  nav.innerHTML = '<div class="home-entry'+(isHome?' active':'')+'" data-step="home">'+APP.C.icon('home')+' 首页</div>' +
    APP.STEPS.map(function(s,i){
      var st=APP.Steps.get(s.id).status;
      var cls='nav-item'+(s.id===cur?' active':'')+(st===APP.ST.LOCKED?' locked':'')+(st===APP.ST.DONE?' done':'');
      var icon = st===APP.ST.DONE?'✓':APP.C.icon(s.icon);
      return '<div class="'+cls+'" data-step="'+s.id+'"><div class="nv-k">STEP '+(i+1)+' · '+APP.ST_LABEL[st]+'</div><div class="nv-t"><span class="nv-i">'+icon+'</span> '+APP.U.esc(s.name)+'</div></div>';
    }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('[data-step]'), function(el){
    el.addEventListener('click', function(){
      var id=el.getAttribute('data-step');
      if(APP.Drawers) APP.Drawers.close('navDrawer');
      if(id==='home'){ APP.act.goHome(); return; }
      if(APP.Steps.get(id).status===APP.ST.LOCKED){ APP.Toast.show('请先完成上一步','warn'); return; }
      APP.state.meta.currentStep=id; APP.Store.save(APP.state); APP.render();
    });
  });
  if(bar) bar.style.width=APP.Steps.progress()+'%';
  if(isHome){ view.innerHTML='<div class="page">'+APP.View.home()+'</div>'; }
  else{ var a=APP.Steps.active(); view.innerHTML = '<div class="page">'+(APP.View[a.id] ? APP.View[a.id]() : '<p>开发中</p>')+'</div>'; }
  if(rail){ rail.innerHTML=APP.View.agentRail(); }
  APP.Settings.render();
  if(APP.PersonaCarousel) APP.PersonaCarousel.sync();
};

    APP.AgentProvider.analyze(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore), {subject:'物理'}, function(r, src){ got=src; });
    ok('Cloud analyze：真实成功后 source=cloud', got==='cloud');
    window.fetch=savedFetch; APP.state.meta.mode=savedMode; APP.AgentProvider.setActive(savedActive);
  })();
  /* 25. Cloud analyze：失败回退 local（同步抛错 / 非法 8 维 schema 两类防线，拆开断言） */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    var savedMode=APP.state.meta.mode, savedFetch=window.fetch, savedActive=APP.AgentProvider.active;
    APP.state.meta.mode='online'; APP.AgentProvider.setActive('cloud');
    var bad={ dimensions:[{id:'lang'},{id:'ask'},{id:'board'},{id:'flow'},{id:'concept'},{id:'experiment'},{id:'logic'},{id:'inquiry'}], avg:70, priority:{dimensionId:'lang'}, grade:'良好' };
    var vBad=APP.Diagnostics.validateDiagnosis(bad);
    ok('Cloud analyze：8 维 schema 被 validateDiagnosis 拒绝', vBad.ok===false);

    window.fetch=function(){ throw new Error('HTTP 500'); };
    var gotThrow=null;
    APP.AgentProvider.analyze(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore), {subject:'物理'}, function(r, src){ gotThrow=src; });
    ok('Cloud analyze：同步抛错回退 source=local', gotThrow==='local', 'src='+gotThrow);

    window.fetch=function(){ return T({ ok:true, json:function(){ return T(bad); } }); };
    var gotBadSchema=null;
    APP.AgentProvider.analyze(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore), {subject:'物理'}, function(r, src){ gotBadSchema=src; });
    ok('Cloud analyze：云端返回 8 维时回退 source=local', gotBadSchema==='local', 'src='+gotBadSchema);

    window.fetch=savedFetch; APP.state.meta.mode=savedMode; APP.AgentProvider.setActive(savedActive);
  })();
  /* 26. Simulate：online真实成功返回学生台词 */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var sim=APP.Simulator.make('xiaolin'); APP.state.context.sim=sim;
    var savedMode=APP.state.meta.mode, savedFetch=window.fetch;
    APP.state.meta.mode='online';
    window.fetch=function(){ return T({ ok:true, json:function(){ return T({ text:'老师，这里我不太明白惯性到底是什么。', sys:null, trigger:'追问' }); } }); };
    var gotText=null, gotSrc=null;
    APP.Simulator.respondRemote(sim, '大家理解了吗？', function(r, src){ gotText=r.text; gotSrc=src; });
    ok('Simulate：online真实成功返回学生台词', !!gotText && gotSrc==='cloud');
    window.fetch=savedFetch; APP.state.meta.mode=savedMode;
  })();
  /* 27. Simulate：online失败后仍可本地继续 */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var sim=APP.Simulator.make('xiaolin'); APP.state.context.sim=sim;
    var savedMode=APP.state.meta.mode, savedFetch=window.fetch;
    APP.state.meta.mode='online';
    window.fetch=function(){ throw new Error('HTTP 500'); };
    var gotText=null, gotSrc=null;
    APP.Simulator.respondRemote(sim, '大家理解了吗？', function(r, src){ gotText=r.text; gotSrc=src; });
    ok('Simulate：online失败后仍可本地继续', !!gotText && gotSrc==='local' && !!sim.currentState);
    window.fetch=savedFetch; APP.state.meta.mode=savedMode;
  })();
  /* 28. Simulate：连续三轮对话状态不丢失 */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var sim=APP.Simulator.make('xiaolin');
    function round(t){
      var r=APP.Simulator.respond(sim,t);
      sim.messages.push({who:'teacher',text:t});
      if(r.sys) sim.messages.push({who:'sys',text:r.sys});
      sim.messages.push({who:'student',text:r.text});
      return r;
    }
    round('同学们，为什么惯性越大越难停下来？');
    var s1=sim.currentState;
    round('那你能举一个生活中的例子吗？');
    var s2=sim.currentState;
    round('如果物体不受力，它会怎样？');
    var s3=sim.currentState;
    ok('Simulate：连续三轮对话状态不丢失', sim.turn===3 && sim.messages.length>=6 && s1 && s2 && s3 && typeof s1==='string' && typeof s2==='string' && typeof s3==='string');
  })();
  /* 29. Sim analysis：endRound 后一定进入 advice */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var sim=APP.Simulator.make('xiaolin');
    sim.messages.push({who:'teacher',text:'为什么惯性越大越难停下来？'});
    sim.messages.push({who:'student',text:'老师，我不太明白惯性是什么。'});
    APP.state.context.sim=sim; sim.stage='classroom';
    APP.act.endRound();
    var entered=sim.stage==='analyzing' && sim.analysisPhase==='working';
    sim.analysis=APP.SimAnalyzer.analyze(sim);
    sim.analysisPhase='done'; sim.stage='advice';
    ok('Sim analysis：endRound 后一定进入 advice', entered && sim.stage==='advice' && sim.analysis && sim.analysis.src==='local');
  })();
  /* 30. Sim analysis：建议最多3条且来自真实 messages */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var sim=APP.Simulator.make('xiaolin');
    sim.messages.push({who:'teacher',text:'为什么惯性越大越难停下来？'});
    sim.messages.push({who:'student',text:'老师，重的物体惯性一定大吗？'});
    sim.messages.push({who:'teacher',text:'惯性只和质量有关，和速度无关。'});
    sim.messages.push({who:'student',text:'哦，我好像明白了。'});
    var an=APP.SimAnalyzer.analyze(sim);
    var withinMessages=an.items.every(function(it){ return it.evidenceIndex==null || (it.evidenceIndex>=0 && it.evidenceIndex<sim.messages.length); });
    ok('Sim analysis：建议最多3条且来自真实 messages', Array.isArray(an.items) && an.items.length>=1 && an.items.length<=3 && an.src==='local' && withinMessages);
  })();
  /* 31. Reteach：载入改进后样例使用 AgentProvider.analyze */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var savedMode=APP.state.meta.mode, savedFetch=window.fetch, savedActive=APP.AgentProvider.active;
    APP.state.meta.mode='online'; APP.AgentProvider.setActive('cloud');
    var local=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptAfter));
    window.fetch=function(){ return T({ ok:true, json:function(){ return T(local); } }); };
    var usedProvider=false, orig=APP.AgentProvider.analyze;
    APP.AgentProvider.analyze=function(){ usedProvider=true; return orig.apply(this, arguments); };
    APP.act.loadReteach();
    APP.AgentProvider.analyze=orig;
    var cmp=APP.state.context.compare;
    ok('Reteach：载入改进后样例使用 AgentProvider.analyze', usedProvider===true && !!cmp && cmp.after && cmp.after.source==='cloud');
    window.fetch=savedFetch; APP.state.meta.mode=savedMode; APP.AgentProvider.setActive(savedActive);
  })();
  /* 32. Reteach：cloud失败后仍生成 compare */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    APP.state.context.diagnosis=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    var savedMode=APP.state.meta.mode, savedFetch=window.fetch, savedActive=APP.AgentProvider.active;
    APP.state.meta.mode='online'; APP.AgentProvider.setActive('cloud');
    window.fetch=function(){ throw new Error('HTTP 500'); };
    APP.act.loadReteach();
    var cmp=APP.state.context.compare;
    ok('Reteach：cloud失败后仍生成 compare', !!cmp && cmp.after && cmp.after.source==='local');
    window.fetch=savedFetch; APP.state.meta.mode=savedMode; APP.AgentProvider.setActive(savedActive);
  })();
  /* 33. Radar：始终读取最终5维 diagnosis（直接断言雷达数据源，拦截 8 轴/undefined 回归） */
  (function(){
    APP.state=APP.Store.fresh(); APP.Store._initSteps(APP.state);
    var d=APP.Engine.diagnose(APP.Engine.parse(APP.KB.sampleLesson.transcriptBefore));
    APP.state.context.diagnosis=d;
    APP.state.meta.currentStep='diagnose';
    var html=APP.View.diagnose();
    var radar=APP.Radar.data(d.dimensions);
    var radarClean=radar.length===5 && radar.every(function(x){ return !!x.name && typeof x.score==='number' && isFinite(x.score); });
    ok('Radar：雷达数据源恒为 5 维且 name/score 完整', radarClean, 'radar.length='+radar.length);
    ok('Radar：页面渲染包含首末维度名', html.indexOf('教师基本素养')>=0 && html.indexOf('思维与育人表现')>=0);
  })();
  return results;
})();

APP.runTests = function(){
  var pass=APP.TESTS.filter(function(t){return t.pass;}).length;
  return { total:APP.TESTS.length, pass:pass, results:APP.TESTS };
};

/* ===================== #region 自定义光标 CustomCursor（极简笔尖线框） ===================== */
/* 独立、低侵入 UI 层：隐藏系统鼠标 + DOM 跟随；不改布局/字体/颜色/交互。
   仅做位置平滑跟随 + hover 放大 / 点击回缩，无拖尾、无光晕、无粒子、无旋转。 */
APP.CustomCursor = (function(){
  var HOVER_SEL='a,button,input,textarea,select,[role="button"],[role="tab"],summary,[onclick],.nav-item,.home-entry,.entry-card,.sim-stu-pick,.persona-card,.spark-node,.btn';
  var TIP_FX=0.5, TIP_FY=0.108;          /* 笔尖热点（图内归一化坐标，笔尖在顶部中央） */
  var el=null, svg=null, sw=20, sh=20;
  var enabled=false, started=false, raf=0;
  var tx=0, ty=0, cx=0, cy=0;
  var hovering=false;

  function mq(q){ try{ return !!(window.matchMedia && window.matchMedia(q).matches); }catch(e){ return false; } }
  function coarse(){ return mq('(pointer:coarse)') || mq('(hover:none)'); }
  function reduced(){ return mq('(prefers-reduced-motion: reduce)'); }
  function measure(){ if(svg && svg.offsetWidth){ sw=svg.offsetWidth; sh=svg.offsetHeight||svg.offsetWidth; } }
  function hitTest(t){ return !!(t && t.closest && t.closest(HOVER_SEL)); }

  function onMove(e){
    if(!enabled) return;
    tx=e.clientX; ty=e.clientY;
    if(!started){ started=true; cx=tx; cy=ty; }
    if(el && el.style.opacity!=='1') el.style.opacity='1';
  }
  function onOver(e){
    if(!enabled||!el) return;
    hovering=hitTest(e.target);
    el.classList.toggle('cc-hover',hovering);
  }
  function onDown(){ if(enabled&&el) el.classList.add('cc-down'); }
  function onUp(){ if(enabled&&el) el.classList.remove('cc-down'); }
  function onLeave(){ if(el) el.style.opacity='0'; }

  function frame(){
    raf=requestAnimationFrame(frame);
    if(!el||!started) return;
    var k = reduced()?1:0.18;
    cx += (tx-cx)*k;
    cy += (ty-cy)*k;
    var ox=sw*TIP_FX, oy=sh*TIP_FY;
    el.style.transform='translate3d('+(cx-ox).toFixed(2)+'px,'+(cy-oy).toFixed(2)+'px,0)';
  }

  return {
    init:function(){
      if(typeof document==='undefined'||typeof window==='undefined') return;
      if(coarse()) return;                                   /* 触屏：完全不启用，保留系统交互 */
      el=document.getElementById('customCursor');
      if(!el) return;
      svg=el.querySelector('svg');
      measure();
      window.addEventListener('resize', measure);
      window.addEventListener('mousemove', onMove, {passive:true});
      window.addEventListener('mouseover', onOver, {passive:true});
      window.addEventListener('mousedown', onDown, {passive:true});
      window.addEventListener('mouseup', onUp, {passive:true});
      window.addEventListener('blur', onUp);
      document.addEventListener('mouseleave', onLeave);
      enabled=true;
      try{ document.documentElement.classList.add('cc-on'); }catch(e){}
      raf=requestAnimationFrame(frame);
    }
  };
})();

/* ===================== #region 初始化 ===================== */
APP.Settings.apply();
APP.render();
APP.CustomCursor.init();
/* 顶栏模式切换 + 设置抽屉交互 */
(function(){
  var sw=document.getElementById('modeSwitch');
  if(sw){
    Array.prototype.forEach.call(sw.querySelectorAll('.ms-btn'), function(b){
      b.addEventListener('click', function(){ APP.Settings.set(b.getAttribute('data-mode')); });
    });
    /* 模式切换支持方向键（WAI-ARIA tablist 键盘交互） */
    sw.addEventListener('keydown', function(e){
      var k=e.key;
      if(k!=='ArrowLeft' && k!=='ArrowRight' && k!=='ArrowUp' && k!=='ArrowDown') return;
      var arr=Array.prototype.slice.call(sw.querySelectorAll('.ms-btn'));
      var idx=arr.indexOf(document.activeElement);
      if(idx<0){ arr[0].focus(); e.preventDefault(); return; }
      var next=(k==='ArrowRight'||k==='ArrowDown')?(idx+1)%arr.length:(idx-1+arr.length)%arr.length;
      arr[next].focus();
      APP.Settings.set(arr[next].getAttribute('data-mode'));
      e.preventDefault();
    });
  }
  var mask=document.getElementById('drawerMask');
  var navT=document.getElementById('navToggle');
  var gear=document.getElementById('gearBtn');
  var ndc=document.getElementById('navDrawerClose');
  var dc=document.getElementById('drawerClose');
  /* 触发按钮：训练导航（左抽屉）/ 设置（右抽屉） */
  if(navT){ navT.addEventListener('click', function(){ APP.Drawers.toggle('navDrawer'); }); }
  if(gear){ gear.addEventListener('click', function(){ APP.Drawers.toggle('drawer'); }); }
  if(ndc){ ndc.addEventListener('click', function(){ APP.Drawers.close('navDrawer'); }); }
  if(dc){ dc.addEventListener('click', function(){ APP.Drawers.close('drawer'); }); }
  /* mask 点击：关闭当前打开的抽屉 */
  if(mask){ mask.addEventListener('click', function(){ APP.Drawers.closeAll(); }); }
  /* 每个抽屉：Esc 关闭 + Tab 焦点陷阱 */
  ['navDrawer','drawer'].forEach(function(id){
    var d=document.getElementById(id); if(!d) return;
    d.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ APP.Drawers.close(id); return; }
      if(e.key!=='Tab') return;
      var fcs=d.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(!fcs.length) return;
      var first=fcs[0], last=fcs[fcs.length-1];
      if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
      else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
    });
  });
})();
if(typeof window!=='undefined' && !window.__tested){
  window.__tested=true;
  var tr=APP.runTests();
  /* 修复：恢复启动快照并回到首页（测试 IIFE 已整体替换 APP.state 并覆写 localStorage） */
  var _restoreHome=function(){
    APP.state=JSON.parse(JSON.stringify(APP.__bootState));
    APP.state.meta.currentStep='home';
    APP.Store.save(APP.state);
    APP.render();
  };
  _restoreHome();
  /* 延迟兜底：测试遗留的异步回调（云端分析 promise 等）会在恢复后再次污染状态并弹提示 */
  setTimeout(function(){
    _restoreHome();
    APP.Toast.show=_bootToast;
  },2500);
  console.log('[青蓝试讲] 内联测试：'+tr.pass+'/'+tr.total+' 通过');
  tr.results.filter(function(t){return !t.pass;}).forEach(function(t){ console.warn('[测试失败] '+t.name); });
}
